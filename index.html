              <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:5}}>
                <div style={{fontSize:11,fontWeight:700,color:'var(--text)'}}>{lbl}</div>
                <div style={{fontSize:11,fontWeight:800,color}}>{s.hours.toFixed(1)}h · {fmt12(s.bedTime)} → {fmt12(s.wakeTime)}</div>
              </div>
              <div style={{height:6,background:'rgba(255,255,255,0.06)',borderRadius:999,overflow:'hidden'}}>
                <div style={{height:'100%',width:`${Math.min(s.hours/12,1)*100}%`,background:color,borderRadius:999,transition:'width 0.5s'}}/>
              </div>
            </div>
          );
        })}
      </div>
    );
  }

  // ── MEAL ROW ─────────────────────────────────────────────────────────────────
  function MealRow({ meal, onDelete, onEdit }) {
    const [confirming, setConfirming] = useState(false);
    return (
      <div className="meal-row">
        <MealBadge type={meal.mealType} size={40}/>
        <div className="meal-info">
          <div className="meal-name">{meal.name}</div>
          {meal.servingSize && <div className="meal-serving">{meal.servingSize}</div>}
          <div className="meal-pills">
            <span className="pill" style={{background:'rgba(167,139,250,0.14)',color:'var(--prot)'}}>P {meal.protein||0}g</span>
            <span className="pill" style={{background:'rgba(251,191,36,0.14)',color:'var(--carb)'}}>C {meal.carbs||0}g</span>
            <span className="pill" style={{background:'rgba(251,146,60,0.14)',color:'var(--fat)'}}>F {meal.fat||0}g</span>
            {(meal.fiber||0) > 0 && <span className="pill" style={{background:'rgba(52,211,153,0.14)',color:'var(--fiber)'}}>Fi {meal.fiber}g</span>}
          </div>
        </div>
        <div className="meal-cal-block">
          <div className="meal-cal-num">{meal.calories}</div>
          <div className="meal-cal-lbl">cal</div>
        </div>
        <button className="icon-btn icon-btn-edit" onClick={() => onEdit(meal)}><IcoEdit size={13}/></button>
        <button className="icon-btn icon-btn-del"
          onClick={() => { if(confirming){onDelete(meal.id);}else{setConfirming(true);setTimeout(()=>setConfirming(false),2500);} }}
          style={confirming ? {background:'rgba(248,113,113,0.28)'} : {}}>
          <IcoX size={12}/>
        </button>
      </div>
    );
  }

  // ── DASHBOARD ────────────────────────────────────────────────────────────────
  function DashboardView({ day, days, goals, foodLibrary, sleepLogs, onDeleteMeal, onEditMeal, onAddWater, onAddToLibrary, onRemoveFromLibrary, onAddWorkout, onDeleteWorkout, onLogSleep, onOpenAddFood }) {
    const [showWater, setShowWater] = useState(false);
    const [showWorkout, setShowWorkout] = useState(false);
    const [showSleep, setShowSleep] = useState(false);
    const [editingMeal, setEditingMeal] = useState(null);

    const meals    = day.meals    || [];
    const workouts = day.workouts || [];
    const mac      = totals(meals);
    const water    = day.waterOz  || 0;
    const bur      = burned(workouts);
    const budget   = goals.calories + bur;
    const calRem   = budget - mac.calories;
    const ringColor= scColor(mac.calories, budget);
    const lastSleep = (sleepLogs||[]).length > 0
      ? [...(sleepLogs||[])].sort((a,b)=>(b.bedDate+(b.bedTime||'')).localeCompare(a.bedDate+(a.bedTime||'')))[0]
      : null;

    return (
      <div className="content">
        <div className="dash-grid">
          {/* ── LEFT: daily totals ── */}
          <div className="dash-left">
            <div className="card cal-card">
              <div className="cal-ring-row">
                <Ring value={mac.calories} max={budget} color={ringColor} size={168} stroke={14}>
                  <div>
                    <div className="ring-big" style={{color:ringColor}}>{Math.round(mac.calories)}</div>
                    <div className="ring-sub">of {Math.round(budget)} kcal</div>
                  </div>
                </Ring>
              </div>
              <div className="cal-badge" style={{
                color: calRem>=0 ? 'var(--green)' : 'var(--red)',
                background: calRem>=0 ? 'rgba(52,211,153,0.1)' : 'rgba(248,113,113,0.1)',
                border:`1px solid ${calRem>=0?'rgba(52,211,153,0.22)':'rgba(248,113,113,0.22)'}`,
              }}>
                {calRem>=0 ? `${Math.round(calRem)} kcal remaining` : `${Math.round(-calRem)} kcal over`}
              </div>
              <div className="cal-stats">
                <div className="cal-stat"><div className="cal-stat-val" style={{color:'var(--cal)'}}>{Math.round(mac.calories)}</div><div className="cal-stat-lbl">Eaten</div></div>
                <div className="cal-stat"><div className="cal-stat-val" style={{color:'var(--green)'}}>{Math.round(bur)}</div><div className="cal-stat-lbl">Burned</div></div>
                <div className="cal-stat"><div className="cal-stat-val" style={{color:calRem>=0?'var(--green)':'var(--red)'}}>{Math.round(Math.abs(calRem))}</div><div className="cal-stat-lbl">{calRem>=0?'Left':'Over'}</div></div>
                <div className="cal-stat"><div className="cal-stat-val">{Math.round(budget)}</div><div className="cal-stat-lbl">Budget</div></div>
              </div>
            </div>

            <div className="card macro-card">
              <div className="section-label">Macronutrients</div>
              <div className="macro-rings">
                {[['Protein',mac.protein,goals.protein,'var(--prot)',false],
                  ['Carbs',  mac.carbs,  goals.carbs,  'var(--carb)',true ],
                  ['Fat',    mac.fat,    goals.fat,    'var(--fat)', false]].map(([lbl,val,goal,color,inv])=>{
                  const r=goal-val, c=scColor(val,goal,inv);
                  return (
                    <div key={lbl} className="mc">
                      <div className="mc-name" style={{color}}>{lbl}</div>
                      <Ring value={val} max={goal} color={color} size={78} stroke={7}>
                        <div>
                          <div style={{fontSize:15,fontWeight:800,color,letterSpacing:'-0.02em'}}>{Math.round(val)}</div>
                          <div style={{fontSize:9,color:'var(--muted)'}}>/ {goal}</div>
                        </div>
                      </Ring>
                      <div className="mc-rem" style={{background:`${c}1f`,color:c}}>
                        {r>=0 ? `${Math.round(r)}g left` : `${Math.round(-r)}g over`}
                      </div>
                    </div>
                  );
                })}
              </div>
              <div style={{marginTop:18}}>
                {(() => {
                  const r=goals.fiber-mac.fiber, c=scColor(mac.fiber,goals.fiber,false);
                  return (
                    <div className="bar-row">
                      <div className="bar-meta">
                        <span className="bar-name" style={{color:'var(--fiber)'}}>Fiber</span>
                        <span className="bar-nums">
                          <span style={{fontWeight:700,color:c}}>{Math.round(mac.fiber)}g</span>
                          <span style={{color:'var(--muted)'}}> / {goals.fiber}g · {r>=0?`${Math.round(r)}g left`:`${Math.round(-r)}g over`}</span>
                        </span>
                      </div>
                      <Bar value={mac.fiber} max={goals.fiber} color={c} height={7}/>
                    </div>
                  );
                })()}
              </div>
            </div>
          </div>

          {/* ── RIGHT: activity + meals ── */}
          <div className="dash-right">
            <div className="activity-grid">
              {/* Water */}
              <div className="mini-card">
                <div className="mini-head">
                  <div className="mini-title"><span className="mini-ico" style={{background:'rgba(56,189,248,0.13)',color:'var(--water)'}}><IcoWater/></span>Hydration</div>
                  <div style={{fontSize:13,fontWeight:800,color:'var(--water)'}}>{Math.round(pct(water,goals.water)*100)}%</div>
                </div>
                <div><span className="water-num">{Math.round(water)}</span><span className="water-unit">/ {goals.water} oz</span></div>
                <div style={{marginTop:11}}><Bar value={water} max={goals.water} color="var(--water)" height={8}/></div>
                <div style={{fontSize:11,color:'var(--muted)',marginTop:9,fontWeight:600}}>{water>=goals.water?'Daily goal reached' : `${Math.round(goals.water-water)} oz remaining`}</div>
                <div className="water-btns">
                  {[8,16,32].map(oz=><button key={oz} className="w-btn" onClick={()=>onAddWater(oz)}>+{oz}</button>)}
                  <button className="w-custom" onClick={()=>setShowWater(true)}>···</button>
                </div>
              </div>

              {/* Workouts */}
              <div className="mini-card">
                <div className="mini-head">
                  <div className="mini-title"><span className="mini-ico" style={{background:'rgba(52,211,153,0.13)',color:'var(--green)'}}><IcoFlame/></span>Workouts</div>
                </div>
                <div><span className="burned-num">{bur > 0 ? `+${Math.round(bur)}` : '0'}</span> <span style={{fontSize:13,fontWeight:600,color:'var(--muted)'}}>kcal</span></div>
                <div style={{fontSize:11,color:'var(--muted)',marginTop:4,fontWeight:600}}>{bur > 0 ? 'Added to your budget' : 'No activity yet'}</div>
                {workouts.length > 0 && <div style={{marginTop:6}}>{workouts.map(w => (
                  <div key={w.id} className="workout-row">
                    <div className="workout-dot"/>
                    <div className="workout-info"><div className="workout-name">{w.name}</div>{w.duration > 0 && <div className="workout-detail">{w.duration} min</div>}</div>
                    <div className="workout-kcal">+{w.caloriesBurned}</div>
                    <button className="icon-btn icon-btn-del" style={{width:26,height:26}} onClick={()=>onDeleteWorkout(w.id)}><IcoX size={11}/></button>
                  </div>
                ))}</div>}
                <button className="log-mini-btn green" onClick={()=>setShowWorkout(true)}><IcoPlus size={12}/> Log Workout</button>
              </div>

              {/* Sleep */}
              <div className="mini-card">
                <div className="mini-head">
                  <div className="mini-title"><span className="mini-ico" style={{background:'rgba(167,139,250,0.13)',color:'var(--prot)'}}><IcoMoon/></span>Sleep</div>
                </div>
                {lastSleep
                  ? <>
                      <div><span className="sleep-num" style={{color:sleepQColor(lastSleep.hours)}}>{lastSleep.hours.toFixed(1)}</span> <span style={{fontSize:13,fontWeight:600,color:'var(--muted)'}}>hrs</span></div>
                      <div className="sleep-lbl">{fmt12(lastSleep.bedTime)} → {fmt12(lastSleep.wakeTime)}</div>
                    </>
                  : <>
                      <div><span className="sleep-num" style={{color:'var(--muted)'}}>—</span></div>
                      <div className="sleep-lbl">No sleep logged</div>
                    </>
                }
                <button className="log-mini-btn purple" onClick={()=>setShowSleep(true)}><IcoPlus size={12}/> Log Sleep</button>
              </div>
            </div>

            {/* Meals */}
            <div>
              <div className="meals-bar">
                <div className="meals-title">Today's Meals</div>
                <button className="btn-accent" onClick={onOpenAddFood}><IcoPlus size={13}/> <span className="topbar-add-label">Log Food</span></button>
              </div>
              <div className="card">
                {meals.length===0
                  ? <div className="empty-state"><div className="empty-state-title">Nothing logged yet</div><div className="empty-state-sub">Tap "Log Food" to track your first meal</div></div>
                  : MEAL_TYPES.map(type => {
                      const group = meals.filter(m=>m.mealType===type);
                      if (!group.length) return null;
                      const gcal = Math.round(totals(group).calories);
                      return (
                        <div key={type}>
                          <div className="meal-group-header">
                            <div className="meal-group-dot" style={{background:M_COLOR[type]}}/>
                            <div className="meal-group-name" style={{color:M_COLOR[type]}}>{type}</div>
                            <div style={{marginLeft:'auto',fontSize:11,fontWeight:700,color:'var(--muted)'}}>{gcal} cal</div>
                          </div>
                          {group.map(m => <MealRow key={m.id} meal={m} onDelete={onDeleteMeal} onEdit={m=>setEditingMeal(m)}/>)}
                        </div>
                      );
                    })
                }
              </div>
            </div>

          </div>
        </div>

        {showWater   && <WaterModal   onSave={oz=>{onAddWater(oz);setShowWater(false);}}  onClose={()=>setShowWater(false)}/>}
        {showWorkout && <WorkoutModal onSave={w=>{onAddWorkout(w);setShowWorkout(false);}} onClose={()=>setShowWorkout(false)}/>}
        {showSleep   && <SleepModal   onSave={s=>{onLogSleep(s);setShowSleep(false);}}     onClose={()=>setShowSleep(false)}/>}
        {editingMeal && (
          <AddFoodModal
            foodLibrary={foodLibrary}
            days={days}
            initialMeal={editingMeal}
            onSave={meal => { onEditMeal(editingMeal.id, meal); setEditingMeal(null); }}
            onAddToLibrary={onAddToLibrary}
            onRemoveFromLibrary={onRemoveFromLibrary}
            onClose={() => setEditingMeal(null)}
          />
        )}
      </div>
    );
  }

  // ── HISTORY ──────────────────────────────────────────────────────────────────
  function HistoryView({ days, goals, onNavigate }) {
    const last30 = Array.from({length:30}, (_,i) => addDays(TODAY, -(i+1)));
    return (
      <div className="content">
        <div className="section-label">Past 30 Days</div>
        <div className="hist-grid">
          {last30.map(date => {
            const day   = days[date] || {};
            const meals = day.meals   || [];
            const wkts  = day.workouts|| [];
            const mac   = totals(meals);
            const bur   = burned(wkts);
            const hasData = meals.length > 0 || wkts.length > 0 || (day.waterOz||0) > 0 || day.weight;

            if (!hasData) {
              return (
                <div key={date} className="hist-card hist-card-empty" onClick={() => onNavigate(date)}>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                    <div>
                      <div className="hist-date">{fmtShort(date)}</div>
                      <div className="hist-sub">No data logged</div>
                    </div>
                    <div className="hist-chevron"><IcoChev dir="right" size={14}/></div>
                  </div>
                </div>
              );
            }

            return (
              <div key={date} className="hist-card" onClick={() => onNavigate(date)}>
                <div className="hist-head">
                  <div>
                    <div className="hist-date">{fmtShort(date)}</div>
                    <div className="hist-sub">
                      {meals.length} meal{meals.length!==1?'s':''}{bur>0?` · ${bur} kcal burned`:''}
                    </div>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    {day.weight && <div className="hist-weight">{day.weight} lbs</div>}
                    <div className="hist-chevron"><IcoChev dir="right" size={14}/></div>
                  </div>
                </div>
                <div className="hist-macros">
                  {[['Cal',Math.round(mac.calories),'var(--cal)'],['Pro',Math.round(mac.protein)+'g','var(--prot)'],
                    ['Crb',Math.round(mac.carbs)+'g','var(--carb)'],['Fat',Math.round(mac.fat)+'g','var(--fat)'],
                    ['Fib',Math.round(mac.fiber)+'g','var(--fiber)'],['H₂O',Math.round(day.waterOz||0)+'oz','var(--water)']].map(([l,v,c])=>(
                    <div key={l} className="hist-m">
                      <div className="hist-m-val" style={{color:c}}>{v}</div>
                      <div className="hist-m-lbl">{l}</div>
                    </div>
                  ))}
                </div>
                <Bar value={mac.calories} max={goals.calories+bur} color={scColor(mac.calories,goals.calories+bur)} height={5}/>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // ── PROFILE ──────────────────────────────────────────────────────────────────
  function ProfileView({ profile, goals, days, foodLibrary, weightLogs, sleepLogs, onUpdateProfile, onUpdateGoals, onDeleteLibraryFood, onEditLibraryFood, onLogLibraryFood }) {
    const [showEditProfile, setShowEditProfile] = useState(false);
    const [showEditGoals,   setShowEditGoals]   = useState(false);
    const [showLibrary,     setShowLibrary]     = useState(false);

    const ht = (profile.heightFt||5)*12+(parseInt(profile.heightIn)||10);
    const bmiv = profile.currentWeight ? ((profile.currentWeight/(ht*ht))*703).toFixed(1) : '—';
    const du = daysUntil(profile.targetDate);
    const totalToLose = ((profile.startWeight||0)-(profile.targetWeight||0))||1;
    const weightLost  = ((profile.startWeight||0)-(profile.currentWeight||0));
    const progPct = totalToLose>0 ? Math.max(0,Math.min((weightLost/totalToLose)*100,100)).toFixed(0) : 0;
    const sortedLogs = [...(weightLogs||[])].sort((a,b)=>(b.date+':'+(b.time||'')).localeCompare(a.date+':'+(a.time||'')));

    return (
      <div className="content">
        <div className="profile-grid">
          {/* ── LEFT COLUMN ── */}
          <div className="pcol">
            {profile.currentWeight && profile.targetWeight && (
              <div className="goal-prog">
                <div className="goal-prog-head">
                  <div>
                    <div className="goal-prog-title">Weight Goal</div>
                    <div style={{fontSize:11,color:'var(--muted)',marginTop:3}}>
                      {profile.currentWeight} → {profile.targetWeight} lbs
                      {du!==null && <span style={{color:du>0?'var(--green)':'var(--red)',marginLeft:8,fontWeight:700}}>{du>0?`${du} days left`:`${Math.abs(du)}d past`}</span>}
                    </div>
                  </div>
                  <div className="goal-prog-pct">{progPct}%</div>
                </div>
                <Bar value={parseFloat(weightLost)} max={totalToLose} color="var(--accent)" height={9}/>
                <div style={{fontSize:11,color:'var(--muted)',marginTop:9}}>
                  {weightLost>0 ? <><span style={{color:'var(--green)',fontWeight:700}}>{parseFloat(weightLost).toFixed(1)} lbs</span> lost · {profile.currentWeight-profile.targetWeight>0?`${(profile.currentWeight-profile.targetWeight).toFixed(1)} lbs to go`:'Goal reached'}</> : 'Log your weight daily to track progress'}
                </div>
              </div>
            )}

            <div className="stats-3">
              {[['Height',`${profile.heightFt||5}'${profile.heightIn||10}"`,'var(--accent)'],
                ['Weight', profile.currentWeight?`${profile.currentWeight}`:'—','var(--cal)'],
                ['BMI', bmiv,'var(--green)']].map(([l,v,c])=>(
                <div key={l} className="stat-card">
                  <div className="stat-val" style={{color:c}}>{v}</div>
                  <div className="stat-lbl">{l}</div>
                </div>
              ))}
            </div>

            <div className="action-row">
              <button className="action-btn" onClick={()=>setShowEditProfile(true)}><IcoEdit size={14}/> Edit Profile</button>
              <button className="action-btn" onClick={()=>setShowEditGoals(true)}><IcoTarget size={14}/> Edit Goals</button>
            </div>

            <div>
              <div className="section-label">Daily Goals</div>
              <div className="goals-grid">
                {[['Calories',goals.calories,'kcal','var(--cal)'],['Protein',goals.protein,'g','var(--prot)'],
                  ['Carbs',goals.carbs,'g','var(--carb)'],['Fat',goals.fat,'g','var(--fat)'],
                  ['Fiber',goals.fiber,'g','var(--fiber)'],['Water',goals.water,'oz','var(--water)']].map(([l,v,u,c])=>(
                  <div key={l} className="goal-box">
                    <div className="goal-box-lbl">{l}</div>
                    <div><span className="goal-box-val" style={{color:c}}>{v}</span><span className="goal-box-unit"> {u}</span></div>
                  </div>
                ))}
              </div>
            </div>

            <div>
              <div className="section-label">Food Database</div>
              <div className="db-card" onClick={()=>setShowLibrary(true)}>
                <div>
                  <div style={{fontSize:14,fontWeight:700}}>Saved Foods</div>
                  <div style={{fontSize:11,color:'var(--muted)',marginTop:3}}>{foodLibrary.length} items · search, edit & scale</div>
                </div>
                <IcoChev dir="right" size={16}/>
              </div>
            </div>
          </div>

          {/* ── RIGHT COLUMN ── */}
          <div className="pcol">
            <WeightChart logs={weightLogs||[]} targetWeight={profile.targetWeight}/>

            {sortedLogs.length > 0 && (
              <div>
                <div className="section-label">Weight Log</div>
                <div className="weight-log">
                  {sortedLogs.slice(0,14).map(e=>(
                    <div key={e.id} className="weight-entry">
                      <div>
                        <div className="weight-entry-date">{fmtShort(e.date)}</div>
                        {e.time && <div style={{fontSize:9,color:'var(--muted)',marginTop:1,fontWeight:600}}>{fmt12(e.time)}</div>}
                      </div>
                      <div className="weight-entry-val">{e.weight} lbs</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <SleepChart logs={sleepLogs||[]}/>
          </div>
        </div>

        {showEditProfile && <EditProfileModal profile={profile} onSave={p=>{onUpdateProfile(p);setShowEditProfile(false);}} onClose={()=>setShowEditProfile(false)}/>}
        {showEditGoals   && <EditGoalsModal   goals={goals}     onSave={g=>{onUpdateGoals(g);setShowEditGoals(false);}}   onClose={()=>setShowEditGoals(false)}/>}
        {showLibrary     && <FoodLibraryModal library={foodLibrary} days={days} onDelete={onDeleteLibraryFood} onEdit={onEditLibraryFood} onLog={onLogLibraryFood} onClose={()=>setShowLibrary(false)}/>}
      </div>
    );
  }

  // ── ONBOARDING ───────────────────────────────────────────────────────────────
  function Onboarding({ onComplete }) {
    const [f, setF] = useState({ name:'', heightFt:5, heightIn:10, currentWeight:'', targetWeight:'', targetDate:'' });
    const [g, setG] = useState({...DEFAULT_GOALS});
    const s  = k => e => setF(v=>({...v,[k]:e.target.value}));
    const gs = k => e => setG(v=>({...v,[k]:parseFloat(e.target.value)||0}));
    return (
      <div className="onboard">
        <div className="onboard-inner">
          <div className="onboard-mark">
            <svg width="30" height="30" viewBox="0 0 28 28" fill="none" stroke="#fff" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M14 4v8m0 0c0 0-3-4-6-4m6 4c0 0 3-4 6-4M4 20c2-4 5-8 10-8s8 4 10 8"/>
            </svg>
          </div>
          <div className="onboard-title">FitTrack</div>
          <div className="onboard-sub">Set up your profile to get started</div>
          <div className="onboard-card">
            <div className="ob-section">About You</div>
            <div className="field"><div className="field-lbl">Name (optional)</div><input className="input" placeholder="Your name" value={f.name} onChange={s('name')}/></div>
            <div className="row2">
              <div className="field"><div className="field-lbl">Height (ft)</div><input className="input" type="number" value={f.heightFt} onChange={s('heightFt')}/></div>
              <div className="field"><div className="field-lbl">Height (in)</div><input className="input" type="number" value={f.heightIn} onChange={s('heightIn')}/></div>
            </div>
            <div className="row2">
              <div className="field"><div className="field-lbl">Current Weight (lbs)</div><input className="input" type="number" inputMode="decimal" placeholder="183" value={f.currentWeight} onChange={s('currentWeight')}/></div>
              <div className="field"><div className="field-lbl">Target Weight (lbs)</div><input className="input" type="number" inputMode="decimal" placeholder="170" value={f.targetWeight} onChange={s('targetWeight')}/></div>
            </div>
            <div className="field"><div className="field-lbl">Target Date</div><input className="input" type="date" value={f.targetDate} onChange={s('targetDate')}/></div>
            <div className="ob-section">Daily Goals</div>
            <div className="row2">
              <div className="field"><div className="field-lbl" style={{color:'var(--cal)'}}>Calories</div><input className="input" type="number" value={g.calories} onChange={gs('calories')}/></div>
              <div className="field"><div className="field-lbl" style={{color:'var(--water)'}}>Water (oz)</div><input className="input" type="number" value={g.water} onChange={gs('water')}/></div>
            </div>
            <div className="row4">
              <div className="field"><div className="field-lbl" style={{color:'var(--prot)'}}>Protein g</div><input className="input" type="number" value={g.protein} onChange={gs('protein')}/></div>
              <div className="field"><div className="field-lbl" style={{color:'var(--carb)'}}>Carbs g</div><input className="input" type="number" value={g.carbs} onChange={gs('carbs')}/></div>
              <div className="field"><div className="field-lbl" style={{color:'var(--fat)'}}>Fat g</div><input className="input" type="number" value={g.fat} onChange={gs('fat')}/></div>
              <div className="field"><div className="field-lbl" style={{color:'var(--fiber)'}}>Fiber g</div><input className="input" type="number" value={g.fiber} onChange={gs('fiber')}/></div>
            </div>
            <button className="btn btn-primary" style={{width:'100%',marginTop:8,padding:14,fontSize:15}}
              onClick={() => onComplete({ name:f.name, heightFt:parseInt(f.heightFt)||5, heightIn:parseInt(f.heightIn)||10, currentWeight:parseFloat(f.currentWeight)||null, startWeight:parseFloat(f.currentWeight)||null, targetWeight:parseFloat(f.targetWeight)||null, targetDate:f.targetDate||'', goals:g })}>
              Get Started
            </button>
          </div>
        </div>
      </div>
    );
  }

  // ── APP ──────────────────────────────────────────────────────────────────────
  // ── SYNC & ENVIRONMENT ───────────────────────────────────────────────────────

  /* Subscribes to FTSync's connection state so the UI can reflect it. */
  function useSyncState() {
    const [state, setState] = useState(() => FTSync.state());
    useEffect(() => FTSync.onChange(setState), []);
    return state;
  }

  const SYNC_LABEL = {
    'synced':     'Synced',
    'syncing':    'Syncing…',
    'error':      'Sync error',
    'signed-out': 'Sign in',
    'offline':    'Local only',
  };

  function SyncPill({ onClick }) {
    const s = useSyncState();
    return (
      <button className="sync-pill" onClick={onClick} title={s.detail || SYNC_LABEL[s.status]}>
        <span className={`sync-dot ${s.status === 'signed-out' ? 'offline' : s.status}`}/>
        <span className="sync-text">{s.status === 'synced' && s.email ? 'Synced' : SYNC_LABEL[s.status]}</span>
      </button>
    );
  }

  function EnvBanner() {
    if (!FTSync.isDev) return null;
    return (
      <div className="env-banner">
        <span>Dev build — changes here do not touch your live data</span>
        <button onClick={() => FTSync.switchEnv('live')}>Go to Live</button>
      </div>
    );
  }

  function AccountModal({ onClose }) {
    const s = useSyncState();
    const [email,  setEmail]  = useState('');
    const [pw,     setPw]     = useState('');
    const [mode,   setMode]   = useState('signin');   // signin | signup
    const [busy,   setBusy]   = useState(false);
    const [err,    setErr]    = useState('');
    const [note,   setNote]   = useState('');

    const run = (fn) => {
      setBusy(true); setErr(''); setNote('');
      fn().then(res => {
        if (mode === 'signup' && res && res.user && !res.session) {
          setNote('Check your email to confirm the account, then sign in.');
          setMode('signin');
        }
      }).catch(e => setErr(e.message || String(e)))
        .finally(() => setBusy(false));
    };

    return (
      <div className="overlay" onClick={e => e.target === e.currentTarget && onClose()}>
        <div className="modal" style={{maxWidth:420}}>
          <div className="modal-title">Account &amp; Sync</div>

          {!s.configured && (
            <div className="field-lbl" style={{textTransform:'none',letterSpacing:0,fontSize:12,lineHeight:1.6,color:'var(--muted)',fontWeight:600}}>
              Cloud sync isn’t configured yet, so FitTrack is saving to this device only.
              Add your Supabase URL and anon key to <code>config.js</code> to sync across
              your phone and desktop. Everything else works exactly as it does now.
            </div>
          )}

          {s.configured && !s.signedIn && (
            <>
              <div className="field">
                <div className="field-lbl">Email</div>
                <input className="input" type="email" autoComplete="username" value={email}
                  onChange={e => setEmail(e.target.value)} placeholder="you@example.com" autoFocus/>
              </div>
              <div className="field">
                <div className="field-lbl">Password</div>
                <input className="input" type="password" autoComplete="current-password" value={pw}
                  onChange={e => setPw(e.target.value)} placeholder="••••••••"
                  onKeyDown={e => e.key === 'Enter' && email && pw && run(() => FTSync[mode === 'signin' ? 'signIn' : 'signUp'](email, pw))}/>
              </div>
              <div className="modal-actions">
                <button className="btn btn-ghost" onClick={() => setMode(m => m === 'signin' ? 'signup' : 'signin')}>
                  {mode === 'signin' ? 'Create account' : 'Have an account'}
                </button>
                <button className="btn btn-primary" disabled={busy || !email || !pw}
                  onClick={() => run(() => FTSync[mode === 'signin' ? 'signIn' : 'signUp'](email, pw))}>
                  {busy ? 'Working…' : (mode === 'signin' ? 'Sign in' : 'Sign up')}
                </button>
              </div>
            </>
          )}

          {s.signedIn && (
            <>
              <div className="field">
                <div className="field-lbl">Signed in as</div>
                <div style={{fontSize:14,fontWeight:700}}>{s.email}</div>
              </div>
              <div className="field">
                <div className="field-lbl">Status</div>
                <div style={{fontSize:13,fontWeight:600,color:'var(--muted)'}}>
                  {SYNC_LABEL[s.status]}{s.detail ? ` — ${s.detail}` : ''}
                </div>
              </div>
              {FTSync.isDev && (
                <div className="modal-actions" style={{marginTop:4}}>
                  <button className="btn btn-ghost" style={{flex:1}} disabled={busy}
                    onClick={() => run(() => FTSync.copyLiveToDev().then(() => setNote('Copied live data into dev.')))}>
                    Copy live data into dev
                  </button>
                </div>
              )}
              <div className="modal-actions">
                <button className="btn btn-ghost" onClick={() => FTSync.signOut()}>Sign out</button>
                <button className="btn btn-primary" onClick={onClose}>Done</button>
              </div>
            </>
          )}

          <div className="field-lbl" style={{marginTop:18,marginBottom:8}}>Environment</div>
          <div style={{display:'flex',gap:10,alignItems:'center'}}>
            <div style={{flex:1,fontSize:13,fontWeight:700}}>
              {FTSync.isDev ? 'Dev' : 'Live'}
              <span style={{color:'var(--muted)',fontWeight:600}}>
                {FTSync.isDev ? ' — a sandbox with its own data' : ' — your real data'}
              </span>
            </div>
            <button className="btn btn-ghost btn-sm"
              onClick={() => FTSync.switchEnv(FTSync.isDev ? 'live' : 'dev')}>
              Switch to {FTSync.isDev ? 'Live' : 'Dev'}
            </button>
          </div>

          {err  && <div style={{marginTop:14,color:'var(--red)',fontSize:12,fontWeight:700}}>{err}</div>}
          {note && <div style={{marginTop:14,color:'var(--green)',fontSize:12,fontWeight:700}}>{note}</div>}

          {(!s.configured || (s.configured && !s.signedIn)) && (
            <div className="modal-actions">
              <button className="btn btn-ghost" style={{flex:1}} onClick={onClose}>Close</button>
            </div>
          )}
        </div>
      </div>
    );
  }

  function App() {
    const [profile,    setProfile]    = useState(() => load('ft_profile', null));
    const [days,       setDays]       = useState(() => load('ft_days', {}));
    const [foodLib,    setFoodLib]    = useState(() => load('ft_library', SAMPLE_LIBRARY));
    const [weightLogs, setWeightLogs] = useState(() => load('ft_weight_logs', []));
    const [sleepLogs,  setSleepLogs]  = useState(() => load('ft_sleep_logs', []));
    const [date,       setDate]       = useState(TODAY);
    const [tab,        setTab]        = useState('dashboard');
    const [showWL,     setWL]         = useState(false);
    const [showAddFood,setShowAddFood]= useState(false);
    const [showAccount,setShowAccount]= useState(false);
    const sync = useSyncState();

    // Changes arriving from another device (or from the initial cloud pull).
    // FTSync has already reconciled and cached them, so the save effects below
    // see identical values and skip pushing them straight back up.
    useEffect(() => FTSync.onRemote((key, value) => {
      if      (key === 'ft_profile')      setProfile(value);
      else if (key === 'ft_days')         setDays(value || {});
      else if (key === 'ft_library')      setFoodLib(value || []);
      else if (key === 'ft_weight_logs')  setWeightLogs(value || []);
      else if (key === 'ft_sleep_logs')   setSleepLogs(value || []);
    }), []);

    useEffect(() => { if(profile) save('ft_profile', profile); }, [profile]);
    useEffect(() => { save('ft_days', days); }, [days]);
    useEffect(() => { save('ft_library', foodLib); }, [foodLib]);
    useEffect(() => { save('ft_weight_logs', weightLogs); }, [weightLogs]);
    useEffect(() => { save('ft_sleep_logs',  sleepLogs);  }, [sleepLogs]);
    useEffect(() => { const el=document.getElementById('loading'); if(el) el.style.display='none'; }, []);

    useEffect(() => {
      setFoodLib(prev => {
        const libNames = new Set(prev.map(f => f.name.toLowerCase()));
        const seen = new Set(); const newFoods = [];
        Object.values(days).forEach(d => (d.meals||[]).forEach(meal => {
          const key = meal.name.toLowerCase();
          if (!libNames.has(key) && !seen.has(key) && meal.name) {
            seen.add(key);
            newFoods.push({ id:Date.now()+Math.random(), name:meal.name, calories:meal.calories||0, protein:meal.protein||0, carbs:meal.carbs||0, fat:meal.fat||0, fiber:meal.fiber||0, servingSize:meal.servingSize||'' });
          }
        }));
        return newFoods.length > 0 ? [...prev, ...newFoods] : prev;
      });
    }, []); // eslint-disable-line

    useEffect(() => {
      setWeightLogs(prev => {
        const existingDates = new Set(prev.map(e=>e.date));
        const migrated = Object.entries(days)
          .filter(([d,data]) => data.weight && !existingDates.has(d))
          .map(([d,data]) => ({id:Date.now()+Math.random(), date:d, time:'08:00', weight:data.weight}));
        return migrated.length > 0 ? [...prev, ...migrated] : prev;
      });
    }, []); // eslint-disable-line

    const goals = profile?.goals ? { ...DEFAULT_GOALS, ...profile.goals } : DEFAULT_GOALS;
    const isToday = date === TODAY;
    const getDay   = d => days[d] || { date:d, meals:[], workouts:[], waterOz:0, weight:null };
    const updateDay= (d, fn) => setDays(prev => ({ ...prev, [d]: fn(prev[d]||{date:d,meals:[],workouts:[],waterOz:0,weight:null}) }));

    const addMeal       = m  => updateDay(date, d => ({ ...d, meals:[...(d.meals||[]),m] }));
    const deleteMeal    = id => updateDay(date, d => ({ ...d, meals:(d.meals||[]).filter(m=>m.id!==id) }));
    const editMeal      = (id,u) => updateDay(date, d => ({ ...d, meals:(d.meals||[]).map(m=>m.id===id?{...u,id}:m) }));
    const addWater      = oz => updateDay(date, d => ({ ...d, waterOz:Math.max(0,(d.waterOz||0)+oz) }));
    const addWorkout    = w  => updateDay(date, d => ({ ...d, workouts:[...(d.workouts||[]),w] }));
    const deleteWorkout = id => updateDay(date, d => ({ ...d, workouts:(d.workouts||[]).filter(w=>w.id!==id) }));
    const logWeight     = ({weight,time}) => {
      updateDay(date, d=>({...d,weight}));
      setProfile(p=>({...p,currentWeight:weight}));
      setWeightLogs(prev=>[...prev,{id:Date.now(),date,time,weight}]);
      setWL(false);
    };
    const logSleep      = s  => setSleepLogs(prev=>[...prev,s]);
    const addToLib      = f  => setFoodLib(prev => {
      const k = (f.name||'').trim().toLowerCase();
      const i = prev.findIndex(e => (e.name||'').trim().toLowerCase() === k);
      if (i >= 0) { const c = [...prev]; c[i] = { ...prev[i], ...f, id:prev[i].id }; return c; }
      return [...prev, {...f, id:Date.now()+Math.random()}];
    });
    const deleteFromLib = id => setFoodLib(prev => prev.filter(f=>f.id!==id));
    const removeFromLib = nm => setFoodLib(prev => prev.filter(f => (f.name||'').trim().toLowerCase() !== (nm||'').trim().toLowerCase()));
    const updateInLib   = f  => {
      const before = foodLib.find(e => e.id === f.id);
      setFoodLib(prev => prev.map(e => e.id===f.id ? f : e));
      // A corrected food should correct the history it produced.
      setDays(prev => restateLoggedMeals(prev, before, f));
    };
    const logFoodToday  = m  => updateDay(TODAY, d => ({ ...d, meals:[...(d.meals||[]),m] }));

    const currentDay = getDay(date);

    if (!profile) {
      // A fresh device that is already signed in almost certainly has a profile
      // waiting in the cloud. Showing onboarding here would invite the user to
      // re-enter data that is seconds away from arriving.
      if (sync.signedIn && sync.status === 'syncing') {
        return (
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100%',gap:14}}>
            <div className="spinner"/>
            <div style={{fontSize:12,color:'var(--muted)',fontWeight:700,letterSpacing:'0.06em',textTransform:'uppercase'}}>
              Restoring your data…
            </div>
          </div>
        );
      }
      return (
        <>
          <Onboarding onComplete={p => setProfile(p)}/>
          <div style={{position:'fixed',top:16,right:16,zIndex:150}}>
            <SyncPill onClick={() => setShowAccount(true)}/>
          </div>
          {showAccount && <AccountModal onClose={() => setShowAccount(false)}/>}
        </>
      );
    }

    const relSub = isToday ? 'Today' : (() => { const dd=daysUntil(date); return dd<0?`${-dd} days ago`:`in ${dd} days`; })();

    return (
      <>
      <EnvBanner/>
      <div className="app">
        {/* ── SIDEBAR ── */}
        <aside className="sidebar">
          <div className="brand">
            <div className="brand-mark">
              <svg width="22" height="22" viewBox="0 0 28 28" fill="none" stroke="#fff" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
                <path d="M14 4v8m0 0c0 0-3-4-6-4m6 4c0 0 3-4 6-4M4 20c2-4 5-8 10-8s8 4 10 8"/>
              </svg>
            </div>
            <div className="brand-text">FitTrack</div>
          </div>
          <div className="nav-cap">Menu</div>
          <nav className="nav">
            {[['dashboard',<IcoDash/>,'Dashboard'],['history',<IcoHist/>,'History'],['profile',<IcoProf/>,'Goals & Profile']].map(([t,icon,lbl])=>(
              <button key={t} className={`nav-item ${tab===t?'active':''}`} onClick={()=>setTab(t)}>
                <span className="nav-ico">{icon}</span><span className="nav-label">{lbl}</span>
              </button>
            ))}
          </nav>
          <div className="sidebar-foot">
            <button className="weight-chip-side" onClick={()=>setWL(true)}>
              <span className="nav-ico"><IcoScale size={20}/></span>
              <div className="ws-block">
                <div className="ws-k">Weight</div>
                <div className="ws-v">{currentDay.weight ? `${currentDay.weight} lbs` : 'Log now'}</div>
              </div>
            </button>
          </div>
        </aside>

        {/* ── MAIN ── */}
        <div className="main">
          <header className="topbar">
            <div className="topbar-left">
              {tab==='dashboard' ? (
                <div className="datenav">
                  <button className="date-btn" onClick={()=>setDate(d=>addDays(d,-1))}><IcoChev dir="left" size={15}/></button>
                  <div className="datenav-label">
                    <div className="datenav-main">{fmtFull(date)}</div>
                    <div className="datenav-sub">{relSub}</div>
                  </div>
                  <button className="date-btn" onClick={()=>setDate(d=>addDays(d,1))}><IcoChev dir="right" size={15}/></button>
                  {!isToday && <button className="today-pill" onClick={()=>setDate(TODAY)}>Jump to Today</button>}
                </div>
              ) : (
                <div className="topbar-title">{tab==='history' ? 'History' : 'Goals & Profile'}</div>
              )}
            </div>
            <div className="topbar-right">
              <div className="version-chip" title={BUILD ? `Build ${BUILD}` : 'Running from source — no build stamp'}>
                {VERSION ? `v${VERSION}` : 'source'}
              </div>
              <SyncPill onClick={()=>setShowAccount(true)}/>
              <button className="weight-chip" onClick={()=>setWL(true)}>{currentDay.weight ? `${currentDay.weight} lbs` : '+ Log Weight'}</button>
              {tab==='dashboard' && <button className="btn-accent" onClick={()=>setShowAddFood(true)}><IcoPlus size={13}/> <span className="topbar-add-label">Log Food</span></button>}
            </div>
          </header>

          <div className="scroll-area">
            {tab==='dashboard' && <DashboardView day={currentDay} days={days} goals={goals} foodLibrary={foodLib} sleepLogs={sleepLogs}
              onDeleteMeal={deleteMeal} onEditMeal={editMeal}
              onAddWater={addWater} onAddToLibrary={addToLib} onRemoveFromLibrary={removeFromLib}
              onAddWorkout={addWorkout} onDeleteWorkout={deleteWorkout} onLogSleep={logSleep}
              onOpenAddFood={()=>setShowAddFood(true)}/>}
            {tab==='history'   && <HistoryView days={days} goals={goals} onNavigate={d=>{setDate(d);setTab('dashboard');}}/>}
            {tab==='profile'   && <ProfileView profile={profile} goals={goals} days={days} foodLibrary={foodLib}
              weightLogs={weightLogs} sleepLogs={sleepLogs}
              onUpdateProfile={p=>setProfile(prev=>({...prev,...p}))}
              onUpdateGoals={g=>setProfile(prev=>({...prev,goals:g}))}
              onDeleteLibraryFood={deleteFromLib}
              onEditLibraryFood={updateInLib}
              onLogLibraryFood={logFoodToday}/>}
          </div>
        </div>

        {showWL && <LogWeightModal current={currentDay.weight} onSave={logWeight} onClose={()=>setWL(false)}/>}
        {showAddFood && <AddFoodModal foodLibrary={foodLib} days={days}
          onSave={m=>{addMeal(m);setShowAddFood(false);}}
          onAddToLibrary={addToLib} onRemoveFromLibrary={removeFromLib}
          onClose={()=>setShowAddFood(false)}/>}
        {showAccount && <AccountModal onClose={()=>setShowAccount(false)}/>}
      </div>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
