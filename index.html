<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>FitTrack</title>
  <script src="./lib/react.min.js"></script>
  <script src="./lib/react-dom.min.js"></script>
  <script src="./lib/supabase.min.js"></script>
  <script src="./config.js"></script>
  <script src="./sync.js"></script>
  <script src="./lib/babel.min.js"></script>
  <style>
    :root {
      --bg:    #0a0b12;
      --card:  #12141f;
      --card2: #1a1d2b;
      --card3: #232740;
      --border:  #222538;
      --border2: #2f3350;
      --text:  #e7eaf6;
      --muted: #8b92b5;
      --accent: #6366f1;
      --cal:   #f472b6;
      --prot:  #a78bfa;
      --carb:  #fbbf24;
      --fat:   #fb923c;
      --fiber: #34d399;
      --water: #38bdf8;
      --green: #34d399;
      --red:   #f87171;
      --r: 16px; --rs: 11px; --rl: 20px;
      --sidebar: 224px;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body {
      font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:var(--bg); color:var(--text); overflow:hidden;
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    }
    #root { height:100%; }
    button { font-family:inherit; cursor:pointer; border:none; outline:none; background:none; color:inherit; }
    input,select,textarea { font-family:inherit; outline:none; }
    ::selection { background:rgba(99,102,241,0.35); }

    .scroll-area::-webkit-scrollbar, .modal::-webkit-scrollbar { width:11px; height:11px; }
    .scroll-area::-webkit-scrollbar-thumb, .modal::-webkit-scrollbar-thumb { background:var(--border2); border-radius:999px; border:3px solid transparent; background-clip:padding-box; }
    .scroll-area::-webkit-scrollbar-thumb:hover { background:#3a3f63; background-clip:padding-box; }
    .scroll-area::-webkit-scrollbar-track, .modal::-webkit-scrollbar-track { background:transparent; }
    #loading { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; z-index:999; }
    .spinner { width:38px; height:38px; border:3px solid var(--border2); border-top-color:var(--accent); border-radius:50%; animation:spin 0.75s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── APP SHELL ── */
    .app { display:grid; grid-template-columns:var(--sidebar) 1fr; height:100vh; width:100vw; }

    .sidebar { background:linear-gradient(180deg,#0e0f1a,#0b0c14); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:20px 14px; gap:6px; overflow:hidden; }
    .brand { display:flex; align-items:center; gap:12px; padding:6px 8px 20px; }
    .brand-mark { width:40px; height:40px; border-radius:12px; background:linear-gradient(135deg,#6366f1,#a78bfa); display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 8px 20px -5px rgba(99,102,241,0.65); }
    .brand-text { font-size:19px; font-weight:800; letter-spacing:-0.02em; white-space:nowrap; }
    .nav-cap { font-size:9px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:0.14em; padding:6px 12px; }
    .nav { display:flex; flex-direction:column; gap:4px; flex:1; }
    .nav-item { display:flex; align-items:center; gap:13px; padding:11px 13px; border-radius:12px; color:var(--muted); font-size:14px; font-weight:600; transition:all 0.15s; white-space:nowrap; }
    .nav-item:hover { background:var(--card); color:var(--text); }
    .nav-item.active { background:rgba(99,102,241,0.13); color:#cdd0ff; }
    .nav-item.active .nav-ico { color:var(--accent); }
    .nav-ico { display:flex; align-items:center; justify-content:center; width:20px; flex-shrink:0; }
    .nav-label { white-space:nowrap; }
    .sidebar-foot { margin-top:auto; }
    .weight-chip-side { width:100%; display:flex; align-items:center; gap:12px; padding:11px 13px; border-radius:12px; background:var(--card); border:1px solid var(--border); transition:all 0.15s; }
    .weight-chip-side:hover { border-color:var(--accent); }
    .weight-chip-side .nav-ico { color:var(--accent); }
    .ws-k { font-size:9px; color:var(--muted); font-weight:800; text-transform:uppercase; letter-spacing:0.08em; }
    .ws-v { font-size:13px; font-weight:700; margin-top:1px; }

    .main { display:flex; flex-direction:column; height:100vh; min-width:0; overflow:hidden; }
    .topbar { flex-shrink:0; height:68px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 26px; gap:14px; background:rgba(10,11,18,0.8); backdrop-filter:blur(10px); }
    .topbar-left { min-width:0; display:flex; align-items:center; }
    .topbar-title { font-size:21px; font-weight:800; letter-spacing:-0.02em; }
    .topbar-right { display:flex; align-items:center; gap:10px; flex-shrink:0; }
    .datenav { display:flex; align-items:center; gap:9px; }
    .date-btn { width:35px; height:35px; border-radius:10px; background:var(--card); border:1px solid var(--border); color:var(--muted); display:flex; align-items:center; justify-content:center; transition:all 0.15s; flex-shrink:0; }
    .date-btn:hover { color:var(--text); border-color:var(--border2); background:var(--card2); }
    .datenav-label { text-align:center; min-width:200px; }
    .datenav-main { font-size:15px; font-weight:700; letter-spacing:-0.01em; white-space:nowrap; }
    .datenav-sub { font-size:10px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:0.1em; margin-top:1px; }
    .today-pill { padding:8px 13px; border-radius:10px; background:rgba(99,102,241,0.13); border:1px solid rgba(99,102,241,0.3); color:var(--accent); font-size:12px; font-weight:700; white-space:nowrap; transition:all 0.15s; }
    .today-pill:hover { background:rgba(99,102,241,0.22); }
    .weight-chip { padding:10px 15px; border-radius:11px; background:var(--card); border:1px solid var(--border); font-size:13px; font-weight:700; color:var(--text); transition:all 0.15s; white-space:nowrap; }
    .weight-chip:hover { border-color:var(--accent); color:var(--accent); }
    .btn-accent { display:flex; align-items:center; gap:7px; padding:10px 17px; border-radius:11px; background:var(--accent); color:#fff; font-size:13px; font-weight:700; transition:all 0.15s; white-space:nowrap; box-shadow:0 4px 14px -3px rgba(99,102,241,0.55); }
    .btn-accent:hover { background:#5457e0; transform:translateY(-1px); }
    .btn-accent:active { transform:translateY(0); }

    .scroll-area { flex:1; overflow-y:auto; overflow-x:hidden; min-height:0; }
    .content { padding:24px 26px 52px; max-width:1480px; margin:0 auto; width:100%; }
    .section-label { font-size:10px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:0.13em; margin-bottom:11px; }

    .card { background:var(--card); border-radius:var(--r); border:1px solid var(--border); overflow:hidden; }

    /* ── DASHBOARD GRID ── */
    .dash-grid { display:grid; grid-template-columns:360px 1fr; gap:18px; align-items:start; }
    .dash-left { display:flex; flex-direction:column; gap:16px; position:sticky; top:0; }
    .dash-right { display:flex; flex-direction:column; gap:18px; min-width:0; }

    /* ── CALORIES ── */
    .cal-card { padding:24px 20px 20px; text-align:center; }
    .cal-ring-row { display:flex; justify-content:center; margin-bottom:18px; }
    .ring-big { font-size:32px; font-weight:800; line-height:1; letter-spacing:-0.03em; }
    .ring-sub { font-size:11px; color:var(--muted); margin-top:5px; font-weight:600; }
    .cal-badge { display:inline-block; font-size:13px; font-weight:700; padding:8px 18px; border-radius:999px; margin-bottom:18px; }
    .cal-stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .cal-stat { background:var(--card2); border-radius:var(--rs); border:1px solid var(--border); padding:13px 8px; }
    .cal-stat-val { font-size:19px; font-weight:800; letter-spacing:-0.02em; }
    .cal-stat-lbl { font-size:9px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:0.08em; margin-top:4px; }

    /* ── MACROS ── */
    .macro-card { padding:18px; }
    .macro-rings { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .mc { display:flex; flex-direction:column; align-items:center; gap:9px; }
    .mc-name { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.07em; }
    .mc-rem { font-size:9px; font-weight:700; padding:3px 9px; border-radius:999px; }

    /* ── BARS ── */
    .bar-row { margin-bottom:14px; }
    .bar-row:last-child { margin-bottom:0; }
    .bar-meta { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
    .bar-name { font-size:12px; font-weight:700; }
    .bar-nums { font-size:11px; }
    .bar-track { background:rgba(255,255,255,0.06); border-radius:999px; overflow:hidden; }
    .bar-fill { border-radius:999px; transition:width 0.6s cubic-bezier(0.4,0,0.2,1); }

    /* ── ACTIVITY MINI CARDS ── */
    .activity-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:16px; align-items:start; }
    .mini-card { background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:18px; display:flex; flex-direction:column; }
    .mini-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .mini-title { display:flex; align-items:center; gap:9px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.07em; color:var(--muted); }
    .mini-ico { width:28px; height:28px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .water-num { font-size:30px; font-weight:800; color:var(--water); line-height:1; letter-spacing:-0.03em; }
    .water-unit { font-size:13px; color:var(--muted); margin-left:3px; font-weight:600; }
    .water-btns { display:flex; gap:7px; margin-top:14px; }
    .w-btn { flex:1; padding:9px 2px; background:rgba(56,189,248,0.09); border:1px solid rgba(56,189,248,0.22); border-radius:9px; color:var(--water); font-size:12px; font-weight:700; transition:all 0.15s; }
    .w-btn:hover { background:rgba(56,189,248,0.2); }
    .w-custom { padding:9px 13px; background:var(--card2); border:1px solid var(--border2); border-radius:9px; color:var(--muted); font-size:13px; font-weight:700; transition:all 0.15s; }
    .w-custom:hover { color:var(--text); }
    .burned-num { font-size:27px; font-weight:800; color:var(--green); letter-spacing:-0.03em; }
    .sleep-num { font-size:27px; font-weight:800; letter-spacing:-0.03em; }
    .sleep-lbl { font-size:11px; color:var(--muted); font-weight:600; margin-top:4px; }
    .log-mini-btn { display:flex; align-items:center; justify-content:center; gap:6px; padding:10px; border-radius:10px; font-size:12px; font-weight:700; transition:all 0.15s; width:100%; margin-top:14px; }
    .log-mini-btn.green { background:rgba(52,211,153,0.1); border:1px solid rgba(52,211,153,0.25); color:var(--green); }
    .log-mini-btn.green:hover { background:rgba(52,211,153,0.2); }
    .log-mini-btn.purple { background:rgba(167,139,250,0.1); border:1px solid rgba(167,139,250,0.25); color:var(--prot); }
    .log-mini-btn.purple:hover { background:rgba(167,139,250,0.2); }
    .workout-row { display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--border); }
    .workout-dot { width:8px; height:8px; border-radius:50%; background:var(--green); flex-shrink:0; }
    .workout-info { flex:1; min-width:0; }
    .workout-name { font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .workout-detail { font-size:10px; color:var(--muted); margin-top:1px; }
    .workout-kcal { font-size:13px; font-weight:800; color:var(--green); flex-shrink:0; }

    /* ── MEALS ── */
    .meals-bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:13px; }
    .meals-title { font-size:17px; font-weight:800; letter-spacing:-0.01em; }
    .meal-group-header { display:flex; align-items:center; gap:9px; padding:14px 16px 9px; }
    .meal-group-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .meal-group-name { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.1em; }
    .meal-row { display:flex; align-items:center; gap:13px; padding:13px 16px; border-top:1px solid var(--border); transition:background 0.12s; }
    .meal-row:hover { background:rgba(255,255,255,0.02); }
    .meal-badge { border-radius:11px; display:flex; align-items:center; justify-content:center; font-weight:800; flex-shrink:0; letter-spacing:-0.02em; }
    .meal-info { flex:1; min-width:0; }
    .meal-name { font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .meal-serving { font-size:11px; color:var(--muted); margin-top:2px; }
    .meal-pills { display:flex; gap:5px; margin-top:7px; flex-wrap:wrap; }
    .version-chip { font-size:10px; font-weight:700; color:var(--muted); letter-spacing:0.02em; padding:4px 8px; border-radius:7px; background:var(--card2); border:1px solid var(--border); white-space:nowrap; cursor:default; }
    .pill { font-size:10px; font-weight:700; padding:3px 8px; border-radius:7px; letter-spacing:0.02em; }
    .meal-cal-block { text-align:right; flex-shrink:0; }
    .meal-cal-num { font-size:16px; font-weight:800; letter-spacing:-0.02em; }
    .meal-cal-lbl { font-size:9px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:0.06em; }
    .icon-btn { width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.15s; }
    .icon-btn-edit { background:rgba(99,102,241,0.1); color:var(--accent); }
    .icon-btn-edit:hover { background:rgba(99,102,241,0.22); }
    .icon-btn-del { background:rgba(248,113,113,0.1); color:var(--red); }
    .icon-btn-del:hover { background:rgba(248,113,113,0.22); }
    .empty-state { padding:52px 16px; text-align:center; }
    .empty-state-title { font-size:15px; font-weight:700; margin-bottom:6px; }
    .empty-state-sub { font-size:13px; color:var(--muted); }

    .ring-wrap { position:relative; display:inline-block; }
    .ring-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }

    /* ── MODALS ── */
    .overlay { position:fixed; inset:0; background:rgba(6,7,12,0.72); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:200; padding:24px; }
    .modal { background:var(--card); border-radius:var(--rl); border:1px solid var(--border2); padding:26px; width:100%; max-width:500px; max-height:90vh; overflow-y:auto; animation:fadeScale 0.2s cubic-bezier(0.16,1,0.3,1); box-shadow:0 24px 64px -12px rgba(0,0,0,0.65); }
    @keyframes fadeScale { from { opacity:0; transform:scale(0.96) translateY(10px); } to { opacity:1; transform:scale(1) translateY(0); } }
    .modal-handle { display:none; }
    .modal-title { font-size:19px; font-weight:800; margin-bottom:18px; letter-spacing:-0.02em; }
    .field { margin-bottom:14px; }
    .field-lbl { font-size:10px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:7px; }
    .input { width:100%; padding:12px 13px; background:var(--card2); border:1.5px solid var(--border); border-radius:var(--rs); color:var(--text); font-size:15px; transition:all 0.15s; }
    .input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(99,102,241,0.15); }
    .input::placeholder { color:var(--muted); }
    .row2 { display:flex; gap:10px; }
    .row2 .field { flex:1; }
    .row4 { display:flex; gap:9px; }
    .row4 .field { flex:1; }
    .meal-type-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
    .mt-btn { padding:11px 4px; border-radius:var(--rs); background:var(--card2); border:1.5px solid var(--border); color:var(--muted); font-size:12px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:6px; transition:all 0.15s; }
    .mt-btn:hover { border-color:var(--border2); color:var(--text); }
    .mt-dot { width:9px; height:9px; border-radius:50%; transition:all 0.15s; }
    .mt-btn.sel { border-color:var(--accent); background:rgba(99,102,241,0.12); color:var(--text); }
    .modal-actions { display:flex; gap:10px; margin-top:20px; }
    .btn { display:flex; align-items:center; justify-content:center; gap:6px; padding:13px 18px; border-radius:var(--rs); font-size:14px; font-weight:700; transition:all 0.15s; }
    .btn-primary { background:var(--accent); color:#fff; flex:1; box-shadow:0 4px 14px -3px rgba(99,102,241,0.5); }
    .btn-primary:hover { background:#5457e0; }
    .btn-primary:disabled { opacity:0.4; cursor:default; box-shadow:none; }
    .btn-ghost { background:var(--card2); border:1px solid var(--border2); color:var(--text); }
    .btn-ghost:hover { border-color:var(--muted); }
    .btn-sm { padding:8px 14px; font-size:12px; }
    .workout-preset-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .wp-btn { padding:12px 4px; border-radius:var(--rs); background:var(--card2); border:1.5px solid var(--border); color:var(--muted); font-size:12px; font-weight:700; transition:all 0.15s; }
    .wp-btn:hover { color:var(--text); border-color:var(--border2); }
    .wp-btn.sel { border-color:var(--green); color:var(--green); background:rgba(52,211,153,0.1); }

    /* ── FOOD SEARCH ── */
    .lib-search-wrap { position:relative; }
    .lib-search-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; display:flex; }
    .lib-search { padding-left:38px !important; }
    .lib-results { background:var(--card2); border:1px solid var(--border); border-radius:var(--rs); overflow:hidden; margin-top:8px; }
    .lib-result { display:flex; align-items:center; gap:10px; padding:11px 13px; border-bottom:1px solid var(--border); cursor:pointer; transition:background 0.12s; }
    .lib-result:last-child { border-bottom:none; }
    .lib-result:hover { background:var(--card3); }
    .lib-result-name { font-size:13px; font-weight:700; }
    .lib-result-macros { font-size:10px; color:var(--muted); margin-top:3px; }
    .lib-result-cal { font-size:15px; font-weight:800; color:var(--cal); flex-shrink:0; }
    .lib-result-add { padding:6px 12px; border-radius:8px; background:rgba(99,102,241,0.14); color:var(--accent); font-size:11px; font-weight:700; flex-shrink:0; transition:all 0.12s; }
    .lib-result-add:hover { background:rgba(99,102,241,0.26); }
    .save-toggle { display:flex; align-items:center; gap:11px; padding:13px; cursor:pointer; background:rgba(99,102,241,0.07); border-radius:var(--rs); border:1px solid rgba(99,102,241,0.2); margin-top:14px; transition:all 0.15s; }
    .save-toggle:hover { background:rgba(99,102,241,0.11); }
    .save-toggle-box { width:19px; height:19px; border-radius:5px; border:1.5px solid var(--accent); background:var(--card2); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.15s; }
    .save-toggle-box.checked { background:var(--accent); }
    .save-toggle-label { font-size:13px; font-weight:600; }
    .divider { height:1px; background:var(--border); margin:16px 0; }
    .divider-lbl { text-align:center; margin:-9px 0 14px; }
    .divider-lbl span { background:var(--card); padding:0 12px; font-size:10px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; }
    .unit-select { background:var(--card2); border:1.5px solid var(--border); border-radius:var(--rs); color:var(--text); font-size:14px; font-weight:600; padding:12px 10px; cursor:pointer; -webkit-appearance:none; appearance:none; text-align:center; transition:all 0.15s; min-width:96px; }
    .unit-select:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(99,102,241,0.15); }
    .unit-select option { background:var(--card2); }
    .sleep-hours-preview { text-align:center; padding:18px; background:var(--card2); border-radius:var(--rs); border:1px solid var(--border); margin-bottom:14px; }
    .sleep-hours-big { font-size:38px; font-weight:800; letter-spacing:-0.03em; line-height:1; }
    .sleep-hours-sub { font-size:12px; color:var(--muted); margin-top:6px; font-weight:500; }

    /* ── HISTORY ── */
    .hist-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
    .hist-card { background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:16px 18px; cursor:pointer; transition:all 0.15s; }
    .hist-card:hover { border-color:var(--accent); transform:translateY(-2px); }
    .hist-card-empty { opacity:0.5; }
    .hist-card-empty:hover { opacity:0.85; transform:none; border-color:var(--border2); }
    .hist-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
    .hist-date { font-size:14px; font-weight:800; letter-spacing:-0.01em; }
    .hist-sub { font-size:11px; color:var(--muted); margin-top:3px; }
    .hist-weight { font-size:11px; color:var(--muted); font-weight:700; }
    .hist-macros { display:flex; gap:8px; margin-bottom:11px; }
    .hist-m { flex:1; text-align:center; }
    .hist-m-val { font-size:13px; font-weight:800; }
    .hist-m-lbl { font-size:8px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:0.06em; margin-top:3px; }
    .hist-chevron { color:var(--border2); display:flex; }

    /* ── PROFILE ── */
    .profile-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start; }
    .pcol { display:flex; flex-direction:column; gap:14px; min-width:0; }
    .stats-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
    .stat-card { background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:16px 12px; text-align:center; }
    .stat-val { font-size:22px; font-weight:800; letter-spacing:-0.02em; }
    .stat-lbl { font-size:9px; color:var(--muted); font-weight:800; text-transform:uppercase; letter-spacing:0.08em; margin-top:4px; }
    .goal-prog { background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:18px; }
    .goal-prog-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .goal-prog-title { font-size:14px; font-weight:700; }
    .goal-prog-pct { font-size:24px; font-weight:800; color:var(--accent); letter-spacing:-0.02em; }
    .goals-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
    .goal-box { background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:15px; }
    .goal-box-lbl { font-size:10px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:7px; }
    .goal-box-val { font-size:22px; font-weight:800; letter-spacing:-0.02em; }
    .goal-box-unit { font-size:11px; color:var(--muted); }
    .action-row { display:flex; gap:10px; }
    .action-btn { flex:1; padding:13px; border-radius:var(--r); background:var(--card); border:1.5px solid var(--border2); color:var(--muted); font-size:13px; font-weight:700; transition:all 0.15s; display:flex; align-items:center; justify-content:center; gap:8px; }
    .action-btn:hover { border-color:var(--accent); color:var(--accent); }
    .chart-card { background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:18px; }
    .db-card { background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:16px 18px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; transition:all 0.15s; }
    .db-card:hover { border-color:var(--accent); }
    .weight-log { display:flex; flex-direction:column; gap:7px; }
    .weight-entry { display:flex; align-items:center; justify-content:space-between; padding:11px 14px; background:var(--card); border:1px solid var(--border); border-radius:var(--rs); }
    .weight-entry-date { font-size:12px; color:var(--muted); font-weight:600; }
    .weight-entry-val { font-size:15px; font-weight:800; }
    .lib-food-row { display:flex; align-items:center; gap:11px; padding:12px 14px; border-bottom:1px solid var(--border); }
    .lib-food-row:last-child { border-bottom:none; }
    .lib-food-info { flex:1; min-width:0; }
    .lib-food-name { font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .lib-food-macros { font-size:10px; color:var(--muted); margin-top:3px; }
    .lib-food-cal { font-size:15px; font-weight:800; color:var(--cal); flex-shrink:0; }

    /* ── ONBOARDING ── */
    .onboard { height:100%; overflow-y:auto; display:flex; flex-direction:column; align-items:center; padding:48px 20px; }
    .onboard-inner { width:100%; max-width:440px; }
    .onboard-mark { width:60px; height:60px; border-radius:18px; background:linear-gradient(135deg,#6366f1,#a78bfa); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; box-shadow:0 12px 32px -6px rgba(99,102,241,0.6); }
    .onboard-title { font-size:32px; font-weight:800; letter-spacing:-0.03em; text-align:center; }
    .onboard-sub { font-size:15px; color:var(--muted); margin:6px 0 30px; text-align:center; }
    .onboard-card { background:var(--card); border:1px solid var(--border); border-radius:var(--rl); padding:24px; }
    .ob-section { font-size:10px; font-weight:800; color:var(--accent); text-transform:uppercase; letter-spacing:0.12em; margin:22px 0 14px; }
    .ob-section:first-child { margin-top:0; }

    /* ── RESPONSIVE ── */
    @media (max-width:1180px) {
      .dash-grid { grid-template-columns:1fr; }
      .dash-left { position:static; }
    }
    @media (max-width:920px) {
      :root { --sidebar:72px; }
      .brand-text, .nav-label, .nav-cap, .ws-block { display:none; }
      .brand { justify-content:center; padding:6px 0 20px; }
      .nav-item { justify-content:center; padding:13px 0; }
      .weight-chip-side { justify-content:center; padding:13px 0; gap:0; }
      .profile-grid { grid-template-columns:1fr; }
    }
    @media (max-width:680px) {
      .topbar { padding:0 16px; height:62px; }
      .content { padding:18px 16px 44px; }
      .datenav-label { min-width:128px; }
      .datenav-main { font-size:13px; }
      .topbar-add-label { display:none; }
      .goals-grid { grid-template-columns:1fr 1fr; }
      .weight-chip { display:none; }
    }

    /* ── PHONE: sidebar becomes a bottom tab bar ─────────────────────────── */
    /* The icon rail works down to tablet width, but on a handset a thumb-reach
       bottom bar is the only layout that feels like a native app. */
    @media (max-width:560px) {
      .app {
        grid-template-columns:1fr;
        grid-template-rows:1fr auto;
        height:100dvh;
      }
      .main { order:1; height:auto; min-height:0; }
      .sidebar {
        order:2;
        flex-direction:row;
        align-items:stretch;
        border-right:none;
        border-top:1px solid var(--border);
        padding:6px 6px calc(6px + env(safe-area-inset-bottom));
        gap:2px;
      }
      .brand { display:none; }
      .nav { display:flex; flex-direction:row; flex:1; gap:2px; }
      .nav-item {
        flex:1; flex-direction:column; gap:3px;
        padding:8px 0 6px; border-radius:var(--rs);
      }
      .nav-label {
        display:block; font-size:10px; font-weight:700;
        letter-spacing:0.01em; line-height:1;
      }
      .sidebar-foot { margin-top:0; display:flex; }
      .weight-chip-side { flex-direction:column; gap:3px; padding:8px 14px 6px; }
      .topbar { padding:0 12px; padding-top:env(safe-area-inset-top); height:auto; min-height:58px; }
      .content { padding-bottom:20px; }
      .modal, .modal-card { max-height:88dvh; }
    }

    /* ── SYNC + ENVIRONMENT CHROME ───────────────────────────────────────── */
    .sync-pill {
      display:inline-flex; align-items:center; gap:6px;
      padding:6px 10px; border-radius:999px; cursor:pointer;
      background:var(--card2); border:1px solid var(--border2);
      font-size:11px; font-weight:700; color:var(--muted); white-space:nowrap;
    }
    .sync-pill:hover { border-color:var(--accent); color:var(--text); }
    .sync-dot { width:7px; height:7px; border-radius:50%; background:var(--muted); flex:none; }
    .sync-dot.synced   { background:var(--green); }
    .sync-dot.syncing  { background:var(--carb);  animation:sync-pulse 1s ease-in-out infinite; }
    .sync-dot.error    { background:var(--red);   }
    .sync-dot.offline  { background:var(--muted); }
    @keyframes sync-pulse { 0%,100%{opacity:1;} 50%{opacity:0.25;} }
    @media (max-width:560px) { .sync-pill .sync-text { display:none; } }

    /* A build you can accidentally leave yourself in needs to be impossible to
       mistake for the real thing. */
    .env-banner {
      display:flex; align-items:center; justify-content:center; gap:10px;
      padding:6px 12px; padding-top:calc(6px + env(safe-area-inset-top));
      background:linear-gradient(90deg,#7c3aed,#a855f7); color:#fff;
      font-size:11px; font-weight:800; letter-spacing:0.08em; text-transform:uppercase;
      flex:none;
    }
    .env-banner button {
      background:rgba(255,255,255,0.18); color:#fff; padding:3px 10px;
      border-radius:999px; font-size:10px; font-weight:800; letter-spacing:0.06em;
    }
    .env-banner button:hover { background:rgba(255,255,255,0.32); }
    /* The banner is a sibling of .app, so .app has to yield its fixed height. */
    #root { display:flex; flex-direction:column; }
    .env-banner + .app { height:auto; flex:1; min-height:0; }
    body.is-dev { --accent:#8b5cf6; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div style="font-size:12px;color:#8b92b5;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;">Loading…</div>
  </div>
  <div id="root"></div>

  <script type="text/babel">
  const { useState, useEffect, useRef } = React;

  /* Which build this is. `FT_BUILD` is stamped in at build time and looks like
   * "1.1.0-live-mssj4308": version, environment, and a base-36 stamp of the
   * source it was built from. Unbuilt source has none, and says so rather than
   * claiming a version it cannot vouch for. */
  const BUILD = window.FT_BUILD || null;
  const VERSION = BUILD ? BUILD.split('-')[0] : null;

  // Must run before any component reads storage — it resolves the environment
  // and starts restoring the session.
  FTSync.init();
  if (FTSync.isDev) document.body.classList.add('is-dev');

  const ymd = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  const TODAY = ymd(new Date());
  const MEAL_TYPES = ['Breakfast','Lunch','Dinner','Snack'];
  const M_COLOR = { Breakfast:'#fbbf24', Lunch:'#34d399', Dinner:'#a78bfa', Snack:'#fb923c' };

  const DEFAULT_GOALS = { calories:1800, protein:175, carbs:80, fat:70, fiber:25, water:128 };

  const WORKOUT_PRESETS = [
    { name:'Weight Training', cpm:6  },
    { name:'Running',         cpm:11 },
    { name:'Cycling',         cpm:8  },
    { name:'HIIT',            cpm:13 },
    { name:'Walking',         cpm:4  },
    { name:'Swimming',        cpm:9  },
  ];

  const SAMPLE_LIBRARY = [
    { id:1,  name:'Scrambled Eggs (2 large)',  calories:180, protein:12, carbs:2,  fat:13, fiber:0, grams:100, servingQty:100, servingUnit:'g', servingSize:'100g' },
    { id:2,  name:'Greek Yogurt (plain, 0%)',  calories:120, protein:17, carbs:9,  fat:0,  fiber:0, grams:227, servingQty:227, servingUnit:'g', servingSize:'227g' },
    { id:3,  name:'Cottage Cheese',            calories:110, protein:13, carbs:4,  fat:2,  fiber:0, grams:113, servingQty:113, servingUnit:'g', servingSize:'113g' },
    { id:4,  name:'Chicken Breast (grilled)',  calories:165, protein:31, carbs:0,  fat:3,  fiber:0, grams:113, servingQty:113, servingUnit:'g', servingSize:'113g' },
    { id:5,  name:'Ground Pork (cooked)',       calories:252, protein:22, carbs:0,  fat:18, fiber:0, grams:113, servingQty:113, servingUnit:'g', servingSize:'113g' },
    { id:6,  name:'Sirloin Steak',              calories:207, protein:26, carbs:0,  fat:11, fiber:0, grams:113, servingQty:113, servingUnit:'g', servingSize:'113g' },
    { id:7,  name:'Ground Beef 90/10',          calories:215, protein:26, carbs:0,  fat:12, fiber:0, grams:113, servingQty:113, servingUnit:'g', servingSize:'113g' },
    { id:8,  name:'Protein Shake',              calories:150, protein:25, carbs:5,  fat:3,  fiber:1, grams:35,  servingQty:35,  servingUnit:'g', servingSize:'35g'  },
    { id:9,  name:'Whole Milk',                 calories:150, protein:8,  carbs:12, fat:8,  fiber:0, grams:244, servingQty:244, servingUnit:'g', servingSize:'244g' },
    { id:10, name:'Cheddar Cheese',             calories:110, protein:7,  carbs:0,  fat:9,  fiber:0, grams:28,  servingQty:28,  servingUnit:'g', servingSize:'28g'  },
    { id:11, name:'Bacon (2 strips)',           calories:86,  protein:6,  carbs:0,  fat:7,  fiber:0, grams:23,  servingQty:23,  servingUnit:'g', servingSize:'23g'  },
    { id:12, name:'Egg White (3)',              calories:52,  protein:11, carbs:1,  fat:0,  fiber:0, grams:99,  servingQty:99,  servingUnit:'g', servingSize:'99g'  },
    { id:13, name:'Tuna (canned, water)',       calories:130, protein:28, carbs:0,  fat:1,  fiber:0, grams:142, servingQty:142, servingUnit:'g', servingSize:'142g' },
    { id:14, name:'Salmon (baked)',             calories:175, protein:25, carbs:0,  fat:8,  fiber:0, grams:85,  servingQty:85,  servingUnit:'g', servingSize:'85g'  },
    { id:15, name:'White Rice (cooked)',        calories:206, protein:4,  carbs:45, fat:0,  fiber:1, grams:186, servingQty:186, servingUnit:'g', servingSize:'186g' },
    { id:16, name:'Broccoli (steamed)',         calories:55,  protein:4,  carbs:11, fat:0,  fiber:5, grams:91,  servingQty:91,  servingUnit:'g', servingSize:'91g'  },
    { id:17, name:'Avocado (½)',                calories:120, protein:1,  carbs:6,  fat:11, fiber:5, grams:75,  servingQty:75,  servingUnit:'g', servingSize:'75g'  },
    { id:18, name:'Almonds',                    calories:164, protein:6,  carbs:6,  fat:14, fiber:4, grams:28,  servingQty:28,  servingUnit:'g', servingSize:'28g'  },
    { id:19, name:'Banana',                     calories:105, protein:1,  carbs:27, fat:0,  fiber:3, grams:118, servingQty:118, servingUnit:'g', servingSize:'118g' },
    { id:20, name:'Oatmeal (plain, cooked)',    calories:166, protein:6,  carbs:32, fat:4,  fiber:4, grams:234, servingQty:234, servingUnit:'g', servingSize:'234g' },
  ];

  // ── UNIT HELPERS ─────────────────────────────────────────────────────────────
  const UNITS = ['g','oz','lb','slice','piece','cup','tbsp','tsp','serving'];
  const GRAM_CONV = {g:1, oz:28.3495, lb:453.592};
  const toGrams = (qty,unit) => GRAM_CONV[unit] ? qty*GRAM_CONV[unit] : null;

  /* Volume is its own family. Converting a cup to grams needs the food's
   * density, which nothing here knows, so cups convert to spoons and no
   * further — which is still most of what a kitchen actually needs. */
  const ML_CONV = {cup:236.588, tbsp:14.7868, tsp:4.92892};
  const toMl = (qty,unit) => ML_CONV[unit] ? qty*ML_CONV[unit] : null;

  /* Units that measure the same kind of thing, so a dropdown can offer only
   * the ones a given amount can actually be converted into. */
  const unitFamily = unit => GRAM_CONV[unit] ? Object.keys(GRAM_CONV)
                           : ML_CONV[unit]   ? Object.keys(ML_CONV)
                           : [unit];

  /* How many times bigger `to` is than `from`. Mass converts within mass and
   * volume within volume; identical units divide directly, which covers counted
   * things like slices. Anything else (g -> slice) has no defined conversion
   * and returns null, so callers can re-baseline or refuse rather than quietly
   * leaving the macros wrong. */
  const ratioBetween = (fromQty, fromUnit, toQty, toUnit) => {
    const from = parseFloat(fromQty), to = parseFloat(toQty);
    if (!(from > 0) || !(to >= 0)) return null;
    const fg = toGrams(from, fromUnit), tg = toGrams(to, toUnit);
    if (fg !== null && tg !== null && fg > 0) return tg / fg;
    const fm = toMl(from, fromUnit), tm = toMl(to, toUnit);
    if (fm !== null && tm !== null && fm > 0) return tm / fm;
    if (fromUnit === toUnit) return to / from;
    return null;
  };

  /* Where a food's stored macros come from, in order of how much the evidence
   * is worth: the entry's own structured amount, then a free-text serving, then
   * the last time it was actually logged. Null means nothing was ever recorded
   * and there is nothing to convert against. */
  const foodBasis = (food, days) => {
    if (!food) return null;
    if (food.servingQty) return { qty:String(food.servingQty), unit:food.servingUnit||'g', from:'entry' };
    if (food.servingSize) { const p = parseQtyUnit(food.servingSize); return { ...p, from:'entry' }; }
    const recent = lastLoggedServing(days, food.name);
    return recent ? { ...parseQtyUnit(recent.servingSize), from:'log', date:recent.date } : null;
  };

  /* Re-price every meal already logged from a food whose definition changed.
   *
   * Correcting a food's macros should correct the history that came from it —
   * otherwise the numbers you fixed stay wrong everywhere they were used. Each
   * meal is rescaled to the amount it was actually logged at, so a 25g entry
   * and a 175g entry both end up right rather than both taking the new values
   * verbatim. Meals whose amount cannot be converted to the food's new basis
   * are left untouched: guessing would corrupt them. */
  const restateLoggedMeals = (days, prevFood, nextFood) => {
    const key = (prevFood?.name || nextFood?.name || '').trim().toLowerCase();
    if (!key) return days;
    const basis = foodBasis(nextFood, days);
    let touched = false;

    const next = {};
    Object.entries(days || {}).forEach(([date, day]) => {
      let changed = false;
      const meals = (day.meals || []).map(meal => {
        if ((meal.name || '').trim().toLowerCase() !== key) return meal;

        const amt = meal.servingSize ? parseQtyUnit(meal.servingSize) : null;
        // No amount recorded means the meal took the food's macros as-is, so
        // it should keep doing that.
        const ratio = amt ? (basis ? ratioBetween(basis.qty, basis.unit, amt.qty, amt.unit) : null) : 1;
        if (ratio == null) return meal;

        const sc = v => Math.round((v || 0) * ratio * 10) / 10;
        const updated = { ...meal,
          name: nextFood.name || meal.name,
          calories: Math.round((nextFood.calories || 0) * ratio),
          protein: sc(nextFood.protein), carbs: sc(nextFood.carbs),
          fat: sc(nextFood.fat), fiber: sc(nextFood.fiber || 0) };

        if (JSON.stringify(updated) === JSON.stringify(meal)) return meal;
        changed = true;
        return updated;
      });
      next[date] = changed ? { ...day, meals } : day;
      if (changed) touched = true;
    });

    return touched ? next : days;
  };

  /* The most recent time a food was actually logged, used to recover what a
   * library entry's macros describe when the entry itself never recorded it.
   * A log is the better witness anyway: it is what the numbers were used for. */
  const lastLoggedServing = (days, name) => {
    const key = (name||'').trim().toLowerCase();
    if (!key) return null;
    let best = null;
    Object.values(days||{}).forEach(day => {
      (day.meals||[]).forEach(meal => {
        if ((meal.name||'').trim().toLowerCase() !== key || !meal.servingSize) return;
        const when = meal.addedAt || day.date || '';
        if (!best || String(when) > String(best.when)) best = { when, date:day.date, servingSize:meal.servingSize };
      });
    });
    return best;
  };

  /* The amount a set of macros describes. Scaling always happens relative to
   * one of these, so it works for a library food, a hand-typed food, and a meal
   * edited weeks later alike. */
  const basisFrom = (src, qty, unit) => src == null ? null : ({
    qty: parseFloat(qty) || 1,
    unit,
    calories: parseFloat(src.calories) || 0,
    protein:  parseFloat(src.protein)  || 0,
    carbs:    parseFloat(src.carbs)    || 0,
    fat:      parseFloat(src.fat)      || 0,
    fiber:    parseFloat(src.fiber)    || 0,
  });
  const parseQtyUnit = s => {
    if (!s) return {qty:'1',unit:'g'};
    const m = String(s).trim().match(/^([0-9.]+)\s*(.+)?$/);
    if (m) { const u=(m[2]||'').trim().toLowerCase(); return {qty:m[1], unit:UNITS.includes(u)?u:'g'}; }
    return {qty:'1',unit:'g'};
  };

  // ── UTILS ────────────────────────────────────────────────────────────────────
  // Storage goes through FTSync: still local-first and synchronous, but each
  // write is also queued to the cloud and namespaced by environment. With no
  // cloud configured this is plain localStorage, exactly as before.
  const load    = (k,d) => FTSync.load(k,d);
  const save    = (k,v) => FTSync.save(k,v);
  const fmtFull = d => new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const fmtShort= d => new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  const addDays = (d,n) => { const dt=new Date(d+'T12:00:00'); dt.setDate(dt.getDate()+n); return ymd(dt); };
  const daysUntil = d => { if(!d) return null; return Math.ceil((new Date(d+'T12:00:00')-new Date(TODAY+'T12:00:00'))/86400000); };
  const totals  = meals => meals.reduce((a,m)=>({ calories:a.calories+(m.calories||0), protein:a.protein+(m.protein||0), carbs:a.carbs+(m.carbs||0), fat:a.fat+(m.fat||0), fiber:a.fiber+(m.fiber||0) }), {calories:0,protein:0,carbs:0,fat:0,fiber:0});
  const burned  = wkts  => (wkts||[]).reduce((a,w)=>a+(w.caloriesBurned||0),0);
  const pct     = (v,g) => Math.min(v/Math.max(g,1),1);
  const scColor = (v,g,inv=false) => {
    const p=v/Math.max(g,1);
    if(inv){ if(p>1)return'#f87171'; if(p>0.9)return'#fb923c'; if(p>0.75)return'#fbbf24'; return'#34d399'; }
    else    { if(p>1.05)return'#fb923c'; if(p>=0.8)return'#34d399'; if(p>=0.4)return'#6366f1'; return'#5c6285'; }
  };
  const fmt12 = t => {
    if (!t) return '—';
    const [h,m] = t.split(':').map(Number);
    return `${h%12||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`;
  };
  const sleepQColor = h => h>=8?'var(--green)':h>=7?'var(--accent)':h>=6?'var(--carb)':'var(--red)';

  // ── MEAL BADGE / RING / BAR ──────────────────────────────────────────────────
  function MealBadge({ type, size=38 }) {
    const color = M_COLOR[type]||'#6366f1';
    const letter = (type||'?')[0];
    return (
      <div className="meal-badge" style={{
        width:size, height:size, borderRadius:Math.round(size*0.28),
        background:`${color}1f`, border:`1.5px solid ${color}38`,
        color, fontSize:Math.round(size*0.4), flexShrink:0,
      }}>{letter}</div>
    );
  }

  function Ring({ value, max, color, size=110, stroke=9, children }) {
    const r=(size-stroke*2)/2, circ=2*Math.PI*r, off=circ*(1-Math.min(value/Math.max(max,1),1));
    return (
      <div className="ring-wrap" style={{width:size,height:size}}>
        <svg width={size} height={size} style={{transform:'rotate(-90deg)',display:'block'}}>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth={stroke}/>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round"
            strokeDasharray={circ} strokeDashoffset={off}
            style={{transition:'stroke-dashoffset 0.6s cubic-bezier(0.4,0,0.2,1)',filter:`drop-shadow(0 0 6px ${color}55)`}}/>
        </svg>
        <div className="ring-center">{children}</div>
      </div>
    );
  }

  function Bar({ value, max, color, height=7 }) {
    const p=Math.min(value/Math.max(max,1),1)*100;
    return <div className="bar-track" style={{height}}><div className="bar-fill" style={{width:`${p}%`,background:color,height}}/></div>;
  }

  // ── ADD FOOD MODAL ───────────────────────────────────────────────────────────
  function AddFoodModal({ foodLibrary, days, onSave, onAddToLibrary, onRemoveFromLibrary, onClose, initialMeal }) {
    const isEditing = !!initialMeal;
    const inLib = nm => foodLibrary.some(f => (f.name||'').trim().toLowerCase() === (nm||'').trim().toLowerCase());
    const qs = initialMeal?.servingSize ? parseQtyUnit(initialMeal.servingSize) : {qty:'1', unit:'g'};
    const [search,   setSearch]   = useState('');
    const [baseFood, setBaseFood] = useState(null);
    const [form, setForm] = useState({
      name:     initialMeal?.name     || '',
      mealType: initialMeal?.mealType || 'Breakfast',
      calories: initialMeal?.calories != null ? String(initialMeal.calories) : '',
      protein:  initialMeal?.protein  != null ? String(initialMeal.protein)  : '',
      carbs:    initialMeal?.carbs    != null ? String(initialMeal.carbs)    : '',
      fat:      initialMeal?.fat      != null ? String(initialMeal.fat)      : '',
      fiber:    initialMeal?.fiber    != null ? String(initialMeal.fiber)    : '',
      qty:  qs.qty,
      unit: qs.unit,
    });
    const [saveToLib, setSaveToLib] = useState(isEditing ? inLib(initialMeal?.name) : true);
    const searchRef = useRef(null);
    useEffect(() => { if(searchRef.current) searchRef.current.focus(); }, []);

    /* A meal's macros always describe its own serving size, so an existing meal
     * is its own basis — that is what makes editing one rescale properly. */
    const [basis, setBasis] = useState(() =>
      initialMeal && initialMeal.calories != null ? basisFrom(initialMeal, qs.qty, qs.unit) : null);

    const round1 = v => Math.round(v * 10) / 10;

    /* Scaling runs from the change handlers rather than an effect: an effect
     * watching the macro fields would fight the user as they typed. */
    const applyAmount = (qtyStr, unit) => {
      const q = parseFloat(qtyStr);
      const r = basis && q ? ratioBetween(basis.qty, basis.unit, q, unit) : null;
      if (r === null) { setForm(f => ({ ...f, qty:qtyStr, unit })); return; }
      setForm(f => ({
        ...f, qty:qtyStr, unit,
        calories: String(Math.round(basis.calories * r)),
        protein:  String(round1(basis.protein * r)),
        carbs:    String(round1(basis.carbs   * r)),
        fat:      String(round1(basis.fat     * r)),
        fiber:    String(round1(basis.fiber   * r)),
      }));
    };

    const changeQty = v => applyAmount(v.replace(/[^0-9.]/g,''), form.unit);

    const changeUnit = u => {
      const q = parseFloat(form.qty) || 1;
      /* Some unit changes have no conversion — 85 g is not 85 slices, and
       * carrying the number across would be nonsense. Treat the macros on
       * screen as describing one of the new unit, so the amount becomes "1
       * slice" and scaling continues correctly from there. */
      if (basis && ratioBetween(basis.qty, basis.unit, q, u) === null) {
        setBasis(basisFrom(form, 1, u));
        setForm(f => ({ ...f, qty:'1', unit:u }));
        return;
      }
      applyAmount(form.qty, u);
    };

    const results = search.trim().length > 0
      ? foodLibrary.filter(f => f.name.toLowerCase().includes(search.toLowerCase())).slice(0,6)
      : [];

    const prefill = food => {
      const fb = foodBasis(food, days);
      const sq = fb ? fb.qty : 1;
      const su = fb ? fb.unit : 'serving';
      setForm(f => ({ ...f, name:food.name, calories:String(food.calories), protein:String(food.protein),
        carbs:String(food.carbs), fat:String(food.fat), fiber:String(food.fiber||0),
        qty:String(sq), unit:su }));
      setBaseFood(fb ? {...food, servingQty:sq, servingUnit:su} : null);
      setBasis(fb ? basisFrom(food, sq, su) : null);
      setSearch('');
    };

    const quickAdd = food => {
      const inputQty = parseFloat(form.qty)||1;
      const fb = foodBasis(food, days);
      const ratio = fb ? (ratioBetween(fb.qty, fb.unit, inputQty, form.unit) ?? 1) : 1;
      const sc = v => Math.round((v||0) * ratio * 10) / 10;
      onSave({ id:Date.now(), name:food.name, mealType:form.mealType,
        calories:sc(food.calories), protein:sc(food.protein), carbs:sc(food.carbs),
        fat:sc(food.fat), fiber:sc(food.fiber||0),
        servingSize:`${inputQty} ${form.unit}`, addedAt:new Date().toISOString() });
    };

    const s = k => e => setForm(f=>({...f,[k]:e.target.value}));

    /* Correcting a macro by hand asserts "at this amount, these are the real
     * numbers", so it replaces the basis — otherwise the next amount change
     * would scale from the old value and throw the correction away.
     *
     * This only ever *updates* a basis, never creates one: while a new food is
     * still being typed there is no established amount to scale from, and
     * inventing one would rescale the macros on every keystroke in the amount
     * field. Such a food becomes scalable once it is saved, since the logged
     * meal then carries the serving size its macros describe. */
    const n = k => e => {
      const next = { ...form, [k]: e.target.value.replace(/[^0-9.]/g,'') };
      setForm(next);
      if (basis) setBasis(basisFrom(next, next.qty, next.unit));
    };
    const valid = form.name.trim() && form.calories !== '';

    const doSave = () => {
      if (!valid) return;
      const nm  = form.name.trim();
      const qty = parseFloat(form.qty)||1;
      const meal = {
        id:Date.now(), name:nm, mealType:form.mealType,
        calories:parseFloat(form.calories)||0, protein:parseFloat(form.protein)||0,
        carbs:parseFloat(form.carbs)||0, fat:parseFloat(form.fat)||0,
        fiber:parseFloat(form.fiber)||0,
        servingSize:`${qty} ${form.unit}`,
        addedAt:new Date().toISOString(),
      };
      if (saveToLib && !baseFood) {
        const gramsVal = toGrams(qty, form.unit);
        onAddToLibrary({
          name:nm, id:Date.now()+1,
          calories:parseFloat(form.calories)||0, protein:parseFloat(form.protein)||0,
          carbs:parseFloat(form.carbs)||0, fat:parseFloat(form.fat)||0,
          fiber:parseFloat(form.fiber)||0,
          servingQty:qty, servingUnit:form.unit,
          grams:gramsVal,
          servingSize:`${qty} ${form.unit}`,
        });
      } else if (!saveToLib && inLib(nm) && onRemoveFromLibrary) {
        onRemoveFromLibrary(nm);
      }
      onSave(meal);
    };

    return (
      <div className="overlay" onClick={e => e.target===e.currentTarget && onClose()}>
        <div className="modal">
          <div className="modal-title">{isEditing ? 'Edit Food' : 'Log Food'}</div>

          <div className="field">
            <div className="field-lbl">Meal</div>
            <div className="meal-type-grid">
              {MEAL_TYPES.map(t => {
                const col = M_COLOR[t];
                return (
                  <button key={t} className={`mt-btn ${form.mealType===t?'sel':''}`}
                    onClick={() => setForm(f=>({...f,mealType:t}))}>
                    <div className="mt-dot" style={{background: form.mealType===t ? col : 'var(--border2)'}}/>
                    {t}
                  </button>
                );
              })}
            </div>
          </div>

          {!isEditing && <>
            <div className="field">
              <div className="field-lbl">Search Saved Foods</div>
              <div className="lib-search-wrap">
                <span className="lib-search-icon"><IcoSearch size={14}/></span>
                <input ref={searchRef} className="input lib-search" placeholder="Search your food database…"
                  value={search} onChange={e => setSearch(e.target.value)} />
              </div>
              {results.length > 0 && (
                <div className="lib-results">
                  {results.map(food => (
                    <div key={food.id} className="lib-result">
                      <div onClick={() => prefill(food)} style={{flex:1,minWidth:0}}>
                        <div style={{display:'flex',alignItems:'center',gap:6}}>
                          <div className="lib-result-name">{food.name}</div>
                          {food.grams && <span style={{fontSize:9,fontWeight:800,color:'var(--fiber)',background:'rgba(52,211,153,0.13)',padding:'1px 6px',borderRadius:999,letterSpacing:'0.03em'}}>per g</span>}
                        </div>
                        <div className="lib-result-macros">P {food.protein}g · C {food.carbs}g · F {food.fat}g · Fi {food.fiber||0}g{food.grams?` · base ${food.grams}g`:''}{food.servingSize?' · '+food.servingSize:''}</div>
                      </div>
                      <div className="lib-result-cal">{food.calories}</div>
                      <button className="lib-result-add" onClick={() => quickAdd(food)}>Add</button>
                    </div>
                  ))}
                </div>
              )}
              {search.trim().length > 0 && results.length === 0 && (
                <div style={{fontSize:11,color:'var(--muted)',padding:'8px 0'}}>No matches — fill in the form below.</div>
              )}
            </div>
            <div className="divider"><div className="divider-lbl"><span>Or Enter Manually</span></div></div>
          </>}

          <div className="field">
            <div className="field-lbl">Food Name</div>
            <input className="input" placeholder="e.g. Chicken Breast" value={form.name} onChange={s('name')}
              ref={isEditing ? searchRef : null}/>
          </div>

          <div className="field">
            {basis ? (
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:7}}>
                <div className="field-lbl" style={{marginBottom:0}}>Amount</div>
                <div style={{fontSize:9,color:'var(--fiber)',fontWeight:700}}>
                  {`scales from ${+basis.qty} ${basis.unit}`}
                </div>
              </div>
            ) : <div className="field-lbl">Amount</div>}
            <div style={{display:'flex',gap:10}}>
              <input className="input" type="number" inputMode="decimal" placeholder="1"
                value={form.qty} onChange={e => changeQty(e.target.value)} style={{flex:'2 1 0'}}/>
              <select className="unit-select" value={form.unit}
                onChange={e => changeUnit(e.target.value)}>
                <option value="g">g</option>
                <option value="oz">oz</option>
                <option value="lb">lb</option>
                <option value="slice">slice</option>
                <option value="piece">piece</option>
                <option value="cup">cup</option>
                <option value="tbsp">tbsp</option>
                <option value="tsp">tsp</option>
                <option value="serving">serving</option>
              </select>
            </div>
          </div>

          <div className="field">
            <div className="field-lbl">Calories</div>
            <input className="input" type="number" inputMode="decimal" placeholder="0" value={form.calories} onChange={n('calories')}/>
          </div>

          <div className="row4">
            <div className="field"><div className="field-lbl" style={{color:'var(--prot)'}}>Protein g</div><input className="input" type="number" inputMode="decimal" placeholder="0" value={form.protein} onChange={n('protein')}/></div>
            <div className="field"><div className="field-lbl" style={{color:'var(--carb)'}}>Carbs g</div><input className="input" type="number" inputMode="decimal" placeholder="0" value={form.carbs} onChange={n('carbs')}/></div>
            <div className="field"><div className="field-lbl" style={{color:'var(--fat)'}}>Fat g</div><input className="input" type="number" inputMode="decimal" placeholder="0" value={form.fat} onChange={n('fat')}/></div>
            <div className="field"><div className="field-lbl" style={{color:'var(--fiber)'}}>Fiber g</div><input className="input" type="number" inputMode="decimal" placeholder="0" value={form.fiber} onChange={n('fiber')}/></div>
          </div>

          {!isEditing && (
            <div className="save-toggle" onClick={() => setSaveToLib(v=>!v)}>
              <div className={`save-toggle-box ${saveToLib?'checked':''}`}>{saveToLib && <IcoCheck size={11}/>}</div>
              <div>
                <div className="save-toggle-label">Save to My Foods database</div>
                <div style={{fontSize:11,color:'var(--muted)',fontWeight:500,marginTop:2}}>
                  {saveToLib ? 'Saves so you can find and scale it later' : 'One-time log — not added to your database'}
                </div>
              </div>
            </div>
          )}

          <div className="modal-actions">
            <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
            <button className="btn btn-primary" disabled={!valid} onClick={doSave}>{isEditing ? 'Save Changes' : 'Add Food'}</button>
          </div>
        </div>
      </div>
    );
  }

  function WorkoutModal({ onSave, onClose }) {

  function SleepModal({ onSave, onClose }) {
    const [bedDate,  setBedDate]  = useState(TODAY);
    const [bedTime,  setBedTime]  = useState('22:00');
    const [wakeTime, setWakeTime] = useState('07:00');

    const calcSleep = () => {
      const [bh,bm] = bedTime.split(':').map(Number);
      const [wh,wm] = wakeTime.split(':').map(Number);
      const bedMins  = bh*60+bm, wakeMins = wh*60+wm;
      const cross    = wakeMins <= bedMins;
      const wakeDate = cross ? addDays(bedDate,1) : bedDate;
      const hours    = cross ? (1440-bedMins+wakeMins)/60 : (wakeMins-bedMins)/60;
      return { wakeDate, hours: Math.max(0, hours) };
    };

    const { wakeDate, hours } = calcSleep();
    const color = sleepQColor(hours);

    return (
      <div className="overlay" onClick={e => e.target===e.currentTarget && onClose()}>
        <div className="modal">
          <div className="modal-title">Log Sleep</div>
          <div className="sleep-hours-preview">

              {fmt12(bedTime)} → {fmt12(wakeTime)}
              {bedDate !== wakeDate && ' · wakes next day'}

  function EditFoodModal({ food, days, onSave, onClose }) {
    /* What this entry's macros actually describe. Older entries stored only a
     * free-text serving, or nothing at all, which left "220 calories" meaning
     * nothing in particular — so fall back to the last time the food was
     * logged, which is the best surviving record of what the numbers were for. */
    const known = foodBasis(food, days);
    const recent = known && known.from === 'log' ? known : null;

    const [form, setForm] = useState({
      name:food.name, calories:food.calories, protein:food.protein,
      carbs:food.carbs, fat:food.fat, fiber:food.fiber||0,
      qty: known ? known.qty : '1',
      unit: known ? known.unit : 'serving',
    });
    // Plenty of older entries recorded no serving at all, and no log of them
    // did either. Saying "220 cal for 1 serving" there would be inventing a
    // fact, so the amount is marked unknown until it is actually set.
    const [amountSet, setAmountSet] = useState(!!known);
    const set = (k, v) => setForm(f => ({...f, [k]: v}));
    const setAmount = (k, v) => { setAmountSet(true); set(k, v); };
    const valid = form.name.trim().length > 0 && Number(form.calories) >= 0;

    const qtyNum = parseFloat(form.qty) || 1;
    const amount = `${+qtyNum.toFixed(2)} ${form.unit}`;
    const perGram = toGrams(qtyNum, form.unit);

    const handleSave = () => {
      if (!valid) return;
      // Persist the amount in structured form, not just as a label, so logging
      // this food later can scale from it.
      onSave({ ...food, name:form.name.trim(),
        calories:parseFloat(form.calories)||0, protein:parseFloat(form.protein)||0,
        carbs:parseFloat(form.carbs)||0, fat:parseFloat(form.fat)||0,
        fiber:parseFloat(form.fiber)||0,
        servingQty:amountSet ? qtyNum : food.servingQty,
        servingUnit:amountSet ? form.unit : food.servingUnit,
        grams:amountSet ? toGrams(qtyNum, form.unit) : food.grams,
        servingSize:amountSet ? amount : (food.servingSize||'') });
      onClose();
    };
    return (
      <div className="overlay" onClick={e => e.target===e.currentTarget && onClose()}>
        <div className="modal">
          <div className="modal-title">Edit Food</div>

          <div style={{padding:'11px 13px',marginBottom:13,background:'var(--card2)',
                       border:'1px solid var(--border)',borderLeft:'3px solid var(--accent)',
                       borderRadius:'var(--rs)'}}>
            <div style={{fontSize:13,fontWeight:700,letterSpacing:'-0.01em'}}>
              <span style={{color:'var(--cal)'}}>{parseFloat(form.calories)||0} cal</span>
              <span style={{color:'var(--muted)',fontWeight:600}}> for </span>
              {amountSet
                ? <span>{amount}</span>
                : <span style={{color:'var(--fat)'}}>an amount that was never recorded</span>}
            </div>
            <div style={{fontSize:11,color:'var(--muted)',fontWeight:600,marginTop:3}}>
              P {parseFloat(form.protein)||0}g · C {parseFloat(form.carbs)||0}g · F {parseFloat(form.fat)||0}g · Fi {parseFloat(form.fiber)||0}g
              {amountSet && perGram > 0 && ` · ${Math.round(((parseFloat(form.calories)||0)/perGram)*100)/100} cal/g`}
            </div>
            {recent ? (
              <div style={{fontSize:10,color:'var(--fiber)',fontWeight:700,marginTop:5}}>
                Amount recovered from your last log of this food{recent.date ? ` on ${recent.date}` : ''} — confirm it below
              </div>
            ) : !amountSet && (
              <div style={{fontSize:10,color:'var(--fat)',fontWeight:700,marginTop:5}}>
                Set it below so logging this food can scale correctly
              </div>
            )}
          </div>

          <div className="field">
            <div className="field-lbl">Name</div>
            <input className="input" value={form.name} onChange={e=>set('name',e.target.value)} placeholder="Food name"/>
          </div>
          <div className="row2">
            <div className="field"><div className="field-lbl">Calories</div><input className="input" type="number" min="0" value={form.calories} onChange={e=>set('calories',e.target.value)}/></div>
            <div className="field">
              <div className="field-lbl">These macros are for</div>
              <div style={{display:'flex',gap:8}}>
                <input className="input" type="number" inputMode="decimal" min="0" style={{flex:'1 1 0',minWidth:0}}
                  value={form.qty} onChange={e=>setAmount('qty',e.target.value.replace(/[^0-9.]/g,''))}/>
                <select className="unit-select" value={form.unit} onChange={e=>setAmount('unit',e.target.value)}>
                  {UNITS.map(u => <option key={u} value={u}>{u}</option>)}
                </select>
              </div>
            </div>
          </div>
          <div className="row4">
            <div className="field"><div className="field-lbl" style={{color:'var(--prot)'}}>Protein g</div><input className="input" type="number" min="0" value={form.protein} onChange={e=>set('protein',e.target.value)}/></div>

  function LogLibraryFoodModal({ food, days, onLog, onClose }) {
    const [mealType, setMealType] = useState('Breakfast');

     * measurement and converts within its family. Without one there is nothing
     * to convert against, so it degrades to a plain multiplier — the old
     * behaviour, but now labelled as such instead of pretending to be grams. */
    const basis = foodBasis(food, days);
    const [qty, setQty]   = useState(basis ? basis.qty : '1');
    const [unit, setUnit] = useState(basis ? basis.unit : 'serving');

    const q = Math.max(parseFloat(qty) || 0, 0);
    const ratio = basis ? ratioBetween(basis.qty, basis.unit, q, unit) : q;
    const sc = v => Math.round((v || 0) * (ratio == null ? 1 : ratio) * 10) / 10;
    const options = basis ? unitFamily(basis.unit) : UNITS;

    const handleLog = () => {
      if (ratio == null) return;
      onLog({ id: Date.now(), name: food.name, mealType,
        calories: sc(food.calories), protein: sc(food.protein),
        carbs: sc(food.carbs), fat: sc(food.fat), fiber: sc(food.fiber || 0),
        // Record the amount actually eaten, so editing this meal later — and
        // the food's own basis, if it never had one — can scale from it.
        servingSize: `${+q.toFixed(2)} ${unit}`,
        addedAt: new Date().toISOString() });
      onClose();

      <div className="overlay" onClick={e => e.target===e.currentTarget && onClose()}>
        <div className="modal">

            {basis && basis.from === 'log' && (
              <div style={{fontSize:10,color:'var(--fiber)',fontWeight:700,marginTop:4}}>

            {!basis && (
              <div style={{fontSize:10,color:'var(--fat)',fontWeight:700,marginTop:4}}>
                No amount recorded for this food — counting in whole servings. Set one in My Foods to log it by weight.
              </div>
            )}
          </div>
          <div className="field">
            <div className="field-lbl">Meal</div>
            <div className="meal-type-grid">
              {MEAL_TYPES.map(t => (
                <button key={t} className={`mt-btn ${mealType===t?'sel':''}`} onClick={() => setMealType(t)}>
                  <div className="mt-dot" style={{background: mealType===t ? M_COLOR[t] : 'var(--border2)'}}/>
                  {t}
                </button>
              ))}
            </div>
          </div>
          <div className="row2">
            <div className="field" style={{flex:1}}>
              <div className="field-lbl">{basis ? 'Amount eaten' : 'Servings'}</div>
              <div style={{display:'flex',gap:8}}>
                <input className="input" type="number" min="0" step="any" style={{flex:'1 1 0',minWidth:0}}
                  value={qty} onChange={e => setQty(e.target.value.replace(/[^0-9.]/g,''))}/>
                <select className="unit-select" value={unit} onChange={e => setUnit(e.target.value)}>
                  {options.map(u => <option key={u} value={u}>{u}</option>)}
                </select>
              </div>
            </div>
            <div className="field" style={{flex:1}}>
              <div className="field-lbl">Total Calories</div>
              <div style={{padding:'12px 13px',background:'var(--card2)',border:'1.5px solid var(--border)',borderRadius:'var(--rs)',fontSize:18,fontWeight:800,color:'var(--cal)',letterSpacing:'-0.02em'}}>{sc(food.calories)}</div>

          <div style={{fontSize:11,color:'var(--muted)',marginBottom:10,padding:'9px 13px',background:'var(--card2)',borderRadius:'var(--rs)',border:'1px solid var(--border)'}}>

  // ── WEIGHT CHART ─────────────────────────────────────────────────────────────
  function WeightChart({ logs, targetWeight }) {
    if (!logs || logs.length < 2) return (
      <div className="chart-card">
        <div className="section-label" style={{marginBottom:8}}>Weight Trend</div>
        <div style={{padding:'32px 0',textAlign:'center',color:'var(--muted)',fontSize:12}}>Log 2+ weight entries to see your trend</div>
      </div>
    );
    const sorted = [...logs].sort((a,b) => (a.date+':'+(a.time||'')).localeCompare(b.date+':'+(b.time||'')));
    const ws = sorted.map(e=>e.weight);
    const minW = Math.floor(Math.min(...ws)-3), maxW = Math.ceil(Math.max(...ws)+3);
    const PL=38,PR=10,PT=12,PB=24, W=320,H=120;
    const cW=W-PL-PR, cH=H-PT-PB;
    const xOf = i => PL+(i/(sorted.length-1||1))*cW;
    const yOf = w => PT+cH-((w-minW)/(maxW-minW||1))*cH;
    const pts = sorted.map((e,i)=>[xOf(i),yOf(e.weight)]);
    const linePoly = pts.map(([x,y])=>`${x},${y}`).join(' ');
    const areaPoly = `${pts[0][0]},${PT+cH} `+pts.map(([x,y])=>`${x},${y}`).join(' ')+` ${pts[pts.length-1][0]},${PT+cH}`;
    const step = Math.ceil((maxW-minW)/4)||1;
    const yTicks = [];
    for(let w=Math.ceil(minW/step)*step; w<=maxW; w+=step) yTicks.push(w);
    const idxs = sorted.length<=4 ? sorted.map((_,i)=>i) : [0,Math.floor(sorted.length/2),sorted.length-1];
    const tY = (targetWeight && targetWeight>=minW && targetWeight<=maxW) ? yOf(targetWeight) : null;
    return (
      <div className="chart-card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
          <div className="section-label" style={{marginBottom:0}}>Weight Trend</div>
          <div style={{fontSize:10,color:'var(--muted)',fontWeight:600}}>{sorted.length} entries</div>
        </div>
        <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{overflow:'visible'}}>
          <defs><linearGradient id="wg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#6366f1" stopOpacity="0.3"/><stop offset="100%" stopColor="#6366f1" stopOpacity="0"/></linearGradient></defs>
          {yTicks.map(w=>{const y=yOf(w);return(<g key={w}><line x1={PL} y1={y} x2={W-PR} y2={y} stroke="rgba(255,255,255,0.05)" strokeWidth="1"/><text x={PL-5} y={y+4} fill="#8b92b5" fontSize="9" textAnchor="end" fontFamily="system-ui,sans-serif">{w}</text></g>);})}
          {tY!==null && <line x1={PL} y1={tY} x2={W-PR} y2={tY} stroke="var(--green)" strokeWidth="1.5" strokeDasharray="5,4" opacity="0.75"/>}
          <polygon points={areaPoly} fill="url(#wg2)"/>
          <polyline points={linePoly} fill="none" stroke="#6366f1" strokeWidth="2.4" strokeLinejoin="round" strokeLinecap="round"/>
          {pts.map(([x,y],i)=><circle key={i} cx={x} cy={y} r="3.5" fill="#6366f1" stroke="var(--card)" strokeWidth="1.5"/>)}
          {idxs.map(i=>{const lbl=new Date(sorted[i].date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});return <text key={i} x={xOf(i)} y={H-2} fill="#8b92b5" fontSize="8" textAnchor="middle" fontFamily="system-ui,sans-serif">{lbl}</text>;})}
        </svg>
        {targetWeight && <div style={{fontSize:10,color:'var(--green)',marginTop:6,fontWeight:600}}>— — Target: {targetWeight} lbs</div>}
      </div>
    );
  }
